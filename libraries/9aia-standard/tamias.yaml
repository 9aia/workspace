# 9aia-standard — the org's mimus-standard spec set as a tamias
# content pack.
#
# `type: files` — no driver, no bins, no deploy. The payload is pure
# data: `specs/` carries the workspace floor (`base.toml`, family
# `9aia/base`) plus every org repo's family spec (`<repo>.toml`,
# generated by scripts/gen-repo-specs.py), flattened so one
# directory feeds `mimus standard --spec` (non-recursive, union
# matching — `match` globs select each repo's family).
#
# The copies under specs/ are materialized by
# scripts/sync-spec-pack.py from the sources of truth
# (workspace specs/ + repos/<name>/specs/). They are approval-gated
# exactly like the sources: spec-guard.py and spec-lock.py cover
# libraries/9aia-standard/specs/. Bump `version:` when spec content
# changes — the store keys entries by name@version.
#
# Consume without a sibling workspace checkout:
#
#   tamias install --plan ./libraries/9aia-standard   # dry-run
#   tamias install ./libraries/9aia-standard
#   SPEC_DIR="$(tamias info 9aia-standard --json \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["dir"])')/specs"
#   mimus standard --repo <path> --spec "$SPEC_DIR"
#
# (`--spec` also accepts the deterministic store path directly:
# ~/.local/share/tamias/store/9aia-standard@<version>/specs, or
# $TAMIAS_HOME/store/… when TAMIAS_HOME is set.)
name: 9aia-standard
version: "0.2.0"
type: files
description: >-
  9aia org conformance specs for `mimus standard` — the 9aia/base
  floor plus every repo's family delta, installable as a tamias
  pack so consumers need no sibling workspace checkout.
keywords:
  - mimus
  - standard
  - specs
  - conformance
repository: https://github.com/9aia/workspace
license: UNLICENSED
