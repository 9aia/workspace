# secrets-ci-webhooks — the bupha CI webhook-secret surface, age-sealed
# (tamias ADR-0004 / org P-027 / T-053).
#
# Every payload file under sealed/ is age ciphertext — tamias carries,
# digests, verifies, and signs it opaquely and has NO decrypt path.
# Opening is cuora's job, consumer-side, with the recipient private
# key (~/.config/cuora/identity.txt, mode 0600):
#
#   tamias-driver-cuora open secrets-ci-webhooks BUPHA_WH_9AIA_BUPHA
#   tamias-driver-cuora materialize secrets-ci-webhooks --out <dir>
#   tamias-driver-cuora recipients secrets-ci-webhooks
#
# Refs: `cuora://secrets-ci-webhooks/<NAME>` resolves through the
# installed pack — the engine falls back to installed sealed packs on
# vault miss AND on vault-open failure (packs are the vault-less
# path), so consumers get the pack value transparently via
# `cuora get`/`cuora run -s`/`cuora env` once the pack is installed.
#
# Contents: the 149 `BUPHA_WH_*` webhook HMAC secrets — the
# `secret_env` surface of bupha's ci-gate/ci-ingress fleets
# (repos/bupha/libraries/*/fleet.toml). Canonical vault home is the
# `bupha` scope (`cuora://bupha/<NAME>` in vault `nine`); the
# `cuora://peregrin/<NAME>` copies were deduped away in T-053 (the
# peregrin-secret-cuora adapter falls back to the bupha scope).
#
# Env-agnostic: every sealed value was verified byte-identical
# across dev/staging/preview/prod in vault `nine` (2026-11, sha256
# comparison of all 154 bupha-scope names — the BUPHA_WH_* family
# plus BUPHA_TOKEN, BUPHA_WEBHOOK_SECRET, and the PEREGRIN_* fleet
# names, which are NOT in this pack). Because packs carry no env
# axis, a name whose vault values ever diverge per env must NOT be
# resealed here env-agnostically — it needs env-suffixed file names
# (`<NAME>.<env>`) plus a consumer-side env-aware lookup, or it
# stays vault-only.
#
# NOT sealed here (deliberate): BUPHA_TOKEN, BUPHA_WEBHOOK_SECRET,
# PEREGRIN_TOKEN, PEREGRIN_NODE_TOKEN, PEREGRIN_WH_9AIA_PEREGRIN —
# runner/API credentials, not webhook secrets; they belong to a
# different pack (or stay vault-only) if ever sealed.
#
# Recipients: sealed TO the operator age identity
# (age15m8lntktl0cdva9y0ww44jgkq4epzuy5v0klgdg0d0jkh55nu4kq3ghjnc) —
# the only identity on this host today, same set as secrets-9aia.
# Adding an org member: same runbook as libraries/secrets-9aia —
# they run cuora identity init, send their PUBLIC key, append to a
# recipients file, re-seal the FULL set, bump version, republish.
#
# Rotation: webhook secrets rotate via `cuora put/rotate
# cuora://bupha/<NAME>` in vault `nine` — the pack is a snapshot,
# NOT the live store. Re-seal + republish after any rotation that
# must reach pack consumers; vault-first resolution means
# vault-capable hosts keep working off the vault regardless.
#
# Authoring: `tamias-driver-cuora seal --in <plaintext-dir> --out
# <this dir> --recipients <file>` writes sealed/*.age + recipients
# and merges the sealed: block into tamias.yaml (--manifest). NEVER
# commit plaintext — the publish/install ciphertext gate rejects
# non-.age payloads.
name: secrets-ci-webhooks
version: "1.0.0"
type: secrets
description: >-
  bupha CI webhook HMAC secrets (BUPHA_WH_*), age-sealed (ADR-0004).
  Consumable only by recipient keyholders via tamias-driver-cuora
  open/materialize or cuora://secrets-ci-webhooks/<NAME> refs.

