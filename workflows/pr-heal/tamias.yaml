# pr-heal — CI failure → sepia agent fix → push → verified green →
# campaign-driven merge. Tamias bundle (`type: peregrin-bundle`);
# validated end-to-end in the disposable luisfuturist/pr-heal-spike
# repo (PR #3: red CI → devin session fix → push → green → squash
# merge, all campaign-driven).
#
# Boundaries: lasius owns every git/forge call, sepia owns the agent
# session (POST /api/sessions/run → sessions.prompt_wait), peregrin
# owns only event routing, bupha runs the CI job, tamias distributes.
name: pr-heal
version: "0.3.0"
type: peregrin-bundle
description: >-
  CI failure → sepia agent fix → push → verified green →
  squash merge via lasius forge. Event-driven: forge webhooks
  enqueue ci-jobs, the bupha worker's ci.job.completed event
  (POST /api/events/inject) drives heal/merge — no polling;
  per-PR attempt ledger; worktree cleanup on push/close.

provider:
  # SHARED provider identity — same as ci-gate/ci-ingress/docs-deploy:
  # every peregrin-bundle renders services into the ONE
  # peregrin-campaign.service hosting ~/.config/peregrin/serve/*.yaml
  # on the shared webhook listener. Keep `exec` identical.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Advisory only — the GitHub webhook is registered per repo
    # against the shared listener's LIVE public URL (the cloudflared
    # tunnel fronts :29173). No hooks[] — registration is an operator
    # step (see README).
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
