# pr-heal — CI failure → sepia agent fix → push → green check →
# campaign-driven merge (PL-015, validated e2e in the pr-heal-spike
# repo: PR #3 healed by a devin session and squash-merged by the
# campaign).
#
# Boundaries: lasius owns every git/forge call, sepia owns the agent
# session (via the node's POST /api/sessions/run), peregrin owns only
# event routing. No raw git/gh/devin anywhere in this file.
#
# Flow (one completion channel — ci.job.completed):
#   ci.job.completed ──route──► green.<sha> ──►
#   merge (verify PR head == sha, squash+delete-branch via lasius forge)
#                          ├──► merged.<sha> / skipped.<sha> (report)
#                          ├──► failed.<sha> (non-conflict — report)
#                          └──► conflict.<sha> (unmergeable — mergeable/
#                               merge_state DIRTY) ──► worktree@live-head
#                               (PR number persisted by merge node) ──►
#                               conflict attempt ledger (per-PR cap) ──►
#                               sepia run (merge base, resolve, no
#                               commit/push) ──► commit + push
#                               HEAD:pr-branch ──► cleanup worktree ──►
#                               (CI re-runs → next ci.job.completed)
#   route also emits failed.<sha> (CI red) ──► worktree@sha
#                               (detached; PR lookup is the gate) ──►
#                               attempt ledger (per-PR cap) ──►
#                               sepia run (fix, no commit) ──►
#                               commit + push HEAD:pr-branch ──►
#                               cleanup worktree ──►
#                               (CI re-runs → next ci.job.completed)
#
# Completion signal: the bupha ci-job worker POSTs
# `ci.job.completed` to the campaign host's `/api/events/inject`
# (campaign serve's shared listener — `[worker] events_url` in the
# bupha fleet config points it there) on every terminal
# ci.complete {success,failure,cancelled}. Forge `status`/`check_run`
# webhooks are NO LONGER the completion channel — the forge webhook
# below only feeds push/pull_request → ci-job enqueue. PR
# correlation is unchanged: every downstream node still resolves the
# open PR by exact head_sha via `lasius forge pr list` (the event
# carries repo+sha+key, no PR number — the payload has no forge PR
# identity, so head-sha lookup remains the correlation mechanism).
#
# Ingress filtering lives in the webhook driver, NOT shell gates:
# `push_refs` drops non-default-branch pushes at the door (a shell
# gate's emitted event carries only {stdout,rc,cmd} — the payload the
# enqueue node needs would be lost), and `pull_request_actions` limits
# PR deliveries to open/update actions. `check_run_actions` stays
# only to keep completed-check deliveries from injecting unrouted
# events — nothing subscribes `check_run`/`check_suite`/`status`
# anymore.
#
# Data flow: the sha rides the emitted event TYPE (`*.{sha}` →
# `${event.match.1}`); every node re-derives what it needs (PR lookup,
# worktree path is deterministic per sha). The Rust engine has no
# stdout→state channel, so nothing here relies on `${state.*}`.
# Attempt bounding is a per-PR counter file under worktree_base —
# survives campaign restarts, scoped to the PR number.
name: pr-heal

annotations:
  title: PR heal — CI fail to agent fix to merge
  description: >-
    React to GitHub check_run completions: heal failures with a sepia
    agent session in a lasius worktree, merge on verified green.
  author: 9aia
  tags: [pr-heal, ci, agent, workflow]
  since: "0.1.0"

# Operator-facing knobs (see params.schema.json + README.md). The two
# deployment-specific values — `repo` and `webhook_secret_env` — MUST
# be set per watched repository before install.
config:
  # Watched repo as owner/name — drives the webhook repo filter, the
  # status-event repo check, and docs. REQUIRED per deployment.
  repo: ""
  # Env var holding this repo's webhook HMAC secret — the
  # BUPHA_WH_<OWNER>_<REPO> convention (uppercased, - → _). REQUIRED.
  webhook_secret_env: ""
  # Base URL of `peregrin serve` — sessions + entity plane. The agent
  # step POSTs /api/sessions/run here; bearer = PEREGRIN_TOKEN.
  node_url: "http://127.0.0.1:18787"
  # Local clone lasius operates on (any checkout path — not required
  # to live inside a lasius workspace). REQUIRED per deployment.
  checkout: ""
  # Detached heal worktrees + the per-PR attempt ledger land here.
  worktree_base: "$HOME/.local/share/pr-heal/worktrees"
  # sepia agent id for fix sessions (agent-config name, e.g. devin).
  agent: "devin"
  # Agent session mode applied via ACP session/set_mode after create —
  # REQUIRED for unattended runs: devin's default accept-edits prompts
  # on exec and nothing answers, deadlocking the turn. "bypass"
  # auto-approves everything (fine inside a disposable worktree);
  # "smart" is the safer middle ground.
  agent_mode: "bypass"
  # Per-PR cap on agent heal attempts — counted in
  # <worktree_base>/attempts/pr-<n>, survives restarts.
  max_agent_attempts: 3
  # Per-PR cap on conflict-resolution attempts — counted in
  # <worktree_base>/attempts/pr-<n>-conflicts, survives restarts.
  max_conflict_attempts: 2
  # The CI job lane name used in the agent prompt. ci.job.completed
  # carries no per-check name — the bupha job `key` (repo or
  # repo:<job>) is the lane identity; this only labels the prompt.
  ci_check_name: "ci"
  # Default branch — push events on other refs never enqueue ci-jobs
  # (PR branches are covered by pull_request deliveries).
  default_branch: "main"
  # lasius workspace root (--root) — repo args are checkout paths,
  # so any lasius.toml workspace works; the org workspace is the
  # natural choice.
  lasius_root: "/home/luis/GitHub/9aia/workspace"

# Secret NAMES only — values live in ~/.config/peregrin/env (or cuora).
# PEREGRIN_TOKEN always; the webhook HMAC env var named by
# config.webhook_secret_env must ALSO be declared — the cuora/keyring
# secret legs are `declared_only`, so an undeclared name resolves ONLY
# via the plaintext env file (empty since the cuora migration → the
# ingress node fails `secret unresolved` and the campaign silently
# never registers its demux route). The BUPHA_WH_* glob covers the
# per-deployment `webhook_secret_env` convention; a deployment using a
# non-conventional name adds it via a deploy.d capabilities fragment.
capabilities:
  secrets:
    - PEREGRIN_TOKEN
    - BUPHA_WH_*

# Declared event contracts. `ci.job.completed` is EXTERNAL — no node
# emits it; the bupha ci-job worker POSTs it to the campaign host's
# `/api/events/inject` (campaign serve's shared listener) and it
# lands on the trigger channel like a webhook delivery. Declared
# here so `campaign validate` wires pr-heal.route's subscription and
# the payload shape is documented. Payload (entity_worker.rs):
# {job, key, repo, ref, sha, event, sender, deliveryId, result,
# attempt} — `key` is the ci-job lane (`owner/name` or
# `owner/name:job`), `result` ∈ success|failure|cancelled.
events:
- type: ci.job.completed
  fields:
    job: string
    key: string
    repo: string
    ref: string
    sha: string
    event: string
    sender: string
    deliveryId: string
    result: string
    attempt: number

# No supersede: push and pull_request deliveries for the same commit
# share (repo, sha) — keying on that would cancel the ci-job enqueue.
# Stale-sha heals die honestly downstream instead: the push node's
# PR-head lookup finds no open PR for a superseded sha, and merge
# only fires for the sha that is actually the PR head.

nodes:
# --- ingress: verified deliveries for the watched repo -----------------
- id: pr-heal.ingress
  driver: github-webhook
  on:
  - start
  emits:
  - pr-heal.ingress.listening
  - push
  - pull_request
  - check_run
  - check_suite
  - status
  params:
    # Under `campaign serve` the daemon's --listen/--path govern the
    # ONE shared socket — these are ignored there.
    listen: 127.0.0.1:29173
    path: /hook
    repos:
    - name: "${config.repo}"
      secret_env: "${config.webhook_secret_env}"
    # Completed check_run deliveries still inject (the driver parses
    # them) but nothing subscribes check_run/check_suite/status —
    # completion arrives via ci.job.completed. The filter stays so
    # pending/in_progress deliveries drop at the door too.
    check_run_actions: [completed]
    # PR lifecycle we CI: new heads and updates; closed/merged would
    # enqueue jobs for already-dead refs.
    pull_request_actions: [opened, synchronize, reopened]
    # Only default-branch pushes enqueue a ci-job — the bupha worker
    # gates entity jobs on `ref == fleet.branch`, and a PR-branch push
    # winning the deterministic entity-id race against the
    # pull_request delivery would strand a job the worker never
    # claims. Filtering here (not a shell gate) keeps the push
    # payload intact for the enqueue node.
    push_refs: ["refs/heads/${config.default_branch}"]

# --- enqueue: push/pull_request → ci-job entity (bupha worker) ---------
# Same contract as libraries/ci-ingress: create IS ci.enqueue; the
# deterministic entity id dedups replays. The bupha worker claims the
# job, runs the repo's CI script in a detached worktree, and settles
# ci.complete — whose ci.job.completed emit arrives back here via
# /api/events/inject (routed below). PR jobs run the head sha but
# gate on the base ref (bupha's pull_request convention).
- id: pr-heal.ci.enqueue.push
  driver: http
  on:
  - push
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.node_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "${event.payload.ref}"
        sha: "${event.payload.sha}"
        event: push
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "latest"
        context: "ci/bupha"

- id: pr-heal.ci.enqueue.pr
  driver: http
  on:
  - pull_request
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.node_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "refs/heads/${event.payload.base_ref}"
        sha: "${event.payload.sha}"
        event: pull_request
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "latest"
        context: "ci/bupha"

# --- route: ci.job.completed → green.<sha> | failed.<sha> | ignored ---
# The bupha worker's terminal emit — ONE completion channel for every
# ci-job this campaign's enqueues produce (and any other ci-job on
# the same node; the repo+key filters scope it back down). Payload
# fields (see `events:` above): repo/key/sha/result. Filters:
#   repo == config.repo            — the watched repo only
#   key == repo | repo:*           — whole-repo lane or a per-job
#                                    lane under it (the old
#                                    ci/bupha/* context precedent)
#   result success → green, failure → failed; anything else
#                    (cancelled — e.g. a superseded latest-wins job)
#                    is ignored: a cancelled run never executed, so
#                    there is nothing to heal or merge on.
# PR correlation is NOT in the payload — downstream nodes resolve
# the open PR by exact head_sha via `lasius forge pr list`, same as
# the forge-webhook path did.
- id: pr-heal.route
  driver: shell
  on:
  - ci.job.completed
  emits:
  - pr-heal.check.green.*
  - pr-heal.check.failed.*
  - pr-heal.check.ignored
  max_fires: unlimited
  params:
    cmd: |
      set -u
      [ "${event.payload.repo}" = "${config.repo}" ] || { echo "ignore: repo='${event.payload.repo}'"; exit 2; }
      case "${event.payload.key}" in
        "${config.repo}"|"${config.repo}:"*) ;;
        *) echo "ignore: key='${event.payload.key}'"; exit 2 ;;
      esac
      case "${event.payload.result}" in
        success) exit 0 ;;
        failure) exit 1 ;;
        *) echo "ignore: result='${event.payload.result}'"; exit 2 ;;
      esac
    emit:
      '0': "pr-heal.check.green.${event.payload.sha}"
      '1': "pr-heal.check.failed.${event.payload.sha}"
      default: pr-heal.check.ignored
    timeout: 30

# --- merge: verified green → squash-merge via lasius forge -------------
# Safety: resolve the open PR whose head_sha IS the checked sha, then
# merge. A green check on a stale sha finds no PR → skipped; a head
# that moved after the green check also finds no PR → skipped (the
# merge only ever fires for the exact verified sha).
#
# On merge failure the node classifies the cause: `lasius forge pr
# view --json` exposes `mergeable`/`merge_state` (gh's
# mergeable/mergeStateStatus — CONFLICTING/DIRTY mean the PR can't
# merge cleanly). A conflict routes to the conflict-heal chain below;
# anything else stays a terminal `merge.failed` report. The PR number
# is persisted under <worktree_base>/conflicts/<sha> so the chain can
# re-resolve the live head even if it moves after this event.
- id: pr-heal.merge
  driver: shell
  on:
  - pr-heal.check.green.*
  emits:
  - pr-heal.merged.*
  - pr-heal.merge.skipped.*
  - pr-heal.merge.failed.*
  - pr-heal.merge.conflict.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      SHA='${event.match.1}'
      JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json) || exit 1
      NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      if [ -z "$NUMBER" ]; then
        echo "skip: no open PR with head_sha=$SHA"
        exit 3
      fi
      echo "merging PR #$NUMBER (head $SHA)"
      if OUT=$(lasius --root "${config.lasius_root}" forge pr merge "${config.checkout}" "$NUMBER" --method squash --delete-branch --json 2>&1); then
        printf '%s\n' "$OUT"
        exit 0
      fi
      echo "merge failed: $OUT"
      # No `set -e` above — the merge failure is the signal we classify.
      VIEW=$(lasius --root "${config.lasius_root}" forge pr view "${config.checkout}" "$NUMBER" --json 2>/dev/null) || exit 1
      MERGEABLE=$(printf '%s' "$VIEW" | jq -r '.mergeable // empty')
      MSTATE=$(printf '%s' "$VIEW" | jq -r '.merge_state // empty')
      CONFLICT=0
      case "$MERGEABLE" in CONFLICTING) CONFLICT=1 ;; esac
      if [ "$MSTATE" = "DIRTY" ]; then CONFLICT=1; fi
      if [ "$CONFLICT" -eq 0 ]; then
        # Backend may report UNKNOWN transiently — fall back to the
        # merge command's own diagnostics.
        case "$OUT" in
          *conflict*|*CONFLICT*|*"not mergeable"*) CONFLICT=1 ;;
        esac
      fi
      if [ "$CONFLICT" -eq 1 ]; then
        mkdir -p "${config.worktree_base}/conflicts"
        echo "$NUMBER" > "${config.worktree_base}/conflicts/${SHA}"
        echo "PR #$NUMBER unmergeable (mergeable=$MERGEABLE merge_state=$MSTATE) — routing to conflict resolution"
        exit 4
      fi
      echo "merge failed without a conflict signal (mergeable=$MERGEABLE merge_state=$MSTATE)"
      exit 1
    emit:
      '0': "pr-heal.merged.${event.match.1}"
      '3': "pr-heal.merge.skipped.${event.match.1}"
      '4': "pr-heal.merge.conflict.${event.match.1}"
      default: "pr-heal.merge.failed.${event.match.1}"
    timeout: 120

# --- heal: detached worktree at the PR head sha -------------------------
# Stateless by design: the sha rides the event type (`*.{sha}`) and
# every node re-derives what it needs (PR lookup, worktree path) — the
# Rust engine has no stdout→state channel (`set_state_from_stdout` is
# a TS-era param), so `${state.*}` would stay empty. Detached (no -b)
# so repeat heals never collide on a local branch; push uses
# HEAD:refs/heads/<pr-branch> instead. The PR lookup doubles as the
# "is there anything to heal" gate.
- id: pr-heal.worktree
  driver: shell
  on:
  - pr-heal.check.failed.*
  emits:
  - pr-heal.worktree.ready.*
  - pr-heal.worktree.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
      NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      if [ -z "$NUMBER" ]; then
        echo "no open PR with head_sha=$SHA — nothing to heal"
        exit 1
      fi
      mkdir -p "${config.worktree_base}"
      lasius --root "${config.lasius_root}" vcs fetch "${config.checkout}" --json >/dev/null
      lasius --root "${config.lasius_root}" vcs worktree remove "${config.checkout}" --dir "$WT" --json >/dev/null 2>&1 || true
      lasius --root "${config.lasius_root}" vcs worktree add "${config.checkout}" --dir "$WT" --rev "$SHA" --json >/dev/null
      echo "worktree_path=$WT"
      echo "pr_number=$NUMBER"
      echo "head_sha=$SHA"
    emit:
      '0': "pr-heal.worktree.ready.${event.match.1}"
      default: "pr-heal.worktree.failed.${event.match.1}"
    timeout: 120

# --- heal: per-PR attempt ledger ----------------------------------------
# Counts agent attempts per PR number in <worktree_base>/attempts/ —
# durable across campaign restarts and scoped per PR (unlike a node-
# global max_fires). Over cap → gaveup.<sha>, reported terminally; the
# PR is left for a human.
- id: pr-heal.attempts
  driver: shell
  on:
  - pr-heal.worktree.ready.*
  emits:
  - pr-heal.attempts.ok.*
  - pr-heal.attempts.gaveup.*
  - pr-heal.attempts.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
      NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      if [ -z "$NUMBER" ]; then
        echo "no open PR with head_sha=$SHA — nothing to heal"
        exit 1
      fi
      DIR="${config.worktree_base}/attempts"
      FILE="$DIR/pr-$NUMBER"
      mkdir -p "$DIR"
      COUNT=$(( $(cat "$FILE" 2>/dev/null || echo 0) + 1 ))
      echo "$COUNT" > "$FILE"
      if [ "$COUNT" -gt "${config.max_agent_attempts}" ]; then
        echo "pr #$NUMBER attempt $COUNT exceeds cap ${config.max_agent_attempts} — giving up"
        exit 3
      fi
      echo "pr #$NUMBER attempt $COUNT/${config.max_agent_attempts}"
    emit:
      '0': "pr-heal.attempts.ok.${event.match.1}"
      '3': "pr-heal.attempts.gaveup.${event.match.1}"
      default: "pr-heal.attempts.failed.${event.match.1}"
    timeout: 60

# --- heal: sepia agent session — fix, do not commit ---------------------
# POST /api/sessions/run on the node: create session + blocking
# prompt_wait in one call. shell+curl (not driver:http) so the emitted
# event can carry the sha — and so the bearer token rides curl's
# --config stdin instead of `ps` argv. `mode` is REQUIRED: devin's
# default prompts on exec and an unattended turn deadlocks.
- id: pr-heal.agent
  driver: shell
  on:
  - pr-heal.attempts.ok.*
  emits:
  - pr-heal.agent.done.*
  - pr-heal.agent.failed.*
  # Per-PR attempt cap lives in pr-heal.attempts (durable ledger);
  # max_fires stays as a campaign-lifetime circuit breaker only.
  max_fires: 50
  retry:
    max_attempts: 3
    delay: 5000
    backoff: fixed
  params:
    env:
      PRHEAL_TOKEN: "${secret.PEREGRIN_TOKEN}"
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      # A retried/duplicated ci.job.completed for the same sha (or a
      # second lane reporting on it) must not start a parallel agent
      # on the same worktree. The per-sha lock is held only
      # for the duration of the call: a failed attempt releases it so
      # `retry` can reacquire.
      LOCK="${config.worktree_base}/${SHA:0:12}.agent-lock"
      if ! mkdir "$LOCK" 2>/dev/null; then
        echo "heal already in flight for $SHA"
        exit 1
      fi
      trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
      BODY=$(jq -n \
        --arg cwd "$WT" \
        --arg sha "$SHA" \
        --arg agent "${config.agent}" \
        --arg mode "${config.agent_mode}" \
        --argjson timeout 1800000 \
        '{cwd:$cwd, agent:$agent, mode:$mode, timeoutMs:$timeout, text:(
          "CI check \u0027${config.ci_check_name}\u0027 failed on commit \($sha) in this repository.\n\n" +
          "1. Run the repository CI check to reproduce the failure.\n" +
          "2. Diagnose and fix the root cause so the check passes.\n" +
          "3. Verify the check exits 0.\n\n" +
          "Do NOT commit, push, or open a PR — leave the changes in the working tree."
        )}')
      # Bearer via curl --config on stdin: keeps the token out of `ps`
      # argv (a literal -H "Bearer $TOKEN" would expose it; curl's
      # --variable {{name}} expansion does not apply to -H headers).
      RESP=$(printf 'header = "authorization: Bearer %s"\n' "$PRHEAL_TOKEN" |
        curl -sf --max-time 1900 --config - \
        -X POST "${config.node_url}/api/sessions/run" \
        -H 'content-type: application/json' -d "$BODY")
      echo "$RESP" | jq .
      printf '%s' "$RESP" | jq -e '(.stopReason == "end_turn" or .stopReason == "cancelled") and (.timedOut != true)' >/dev/null
    emit:
      '0': "pr-heal.agent.done.${event.match.1}"
      default: "pr-heal.agent.failed.${event.match.1}"
    timeout: 2000

# --- heal: commit + push HEAD to the PR head branch ---------------------
- id: pr-heal.push
  driver: shell
  on:
  - pr-heal.agent.done.*
  emits:
  - pr-heal.pushed.*
  - pr-heal.push.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
      BRANCH=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].head_ref // empty')
      if [ -z "$BRANCH" ]; then
        echo "no open PR with head_sha=$SHA — cannot name push branch"
        exit 1
      fi
      # No --allow-empty: an agent that produced no diff fails the
      # commit honestly instead of retriggering CI in a loop.
      lasius --root "${config.lasius_root}" vcs commit "$WT" -m "fix: resolve CI failure (pr-heal)" --json
      lasius --root "${config.lasius_root}" vcs push "$WT" --branch "HEAD:refs/heads/$BRANCH" --json
    emit:
      '0': "pr-heal.pushed.${event.match.1}"
      default: "pr-heal.push.failed.${event.match.1}"
    timeout: 120

# --- cleanup: worktree + lock after a successful push -------------------
# The fix is on the PR branch now — the detached worktree has done its
# job. Failure paths keep the worktree for debugging (documented manual
# gc in README); PR-close and terminal gives-ups clean theirs.
- id: pr-heal.cleanup.pushed
  driver: shell
  on:
  - pr-heal.pushed.*
  emits:
  - pr-heal.cleaned.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      lasius --root "${config.lasius_root}" vcs worktree remove "${config.checkout}" --dir "$WT" --json >/dev/null 2>&1 || true
      rmdir "${config.worktree_base}/${SHA:0:12}.agent-lock" 2>/dev/null || true
      echo "cleaned $WT"
    emit:
      '0': "pr-heal.cleaned.${event.match.1}"
    timeout: 60

# --- cleanup: gave up — worktree stays for human inspection -------------
# Attempt-cap gives-up KEEPS the worktree + lock removed only: the
# agent-lock is stale by definition (no agent running), the worktree
# is the debugging surface.
- id: pr-heal.cleanup.gaveup
  driver: shell
  on:
  - pr-heal.attempts.gaveup.*
  emits:
  - pr-heal.cleaned.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      SHA='${event.match.1}'
      rmdir "${config.worktree_base}/${SHA:0:12}.agent-lock" 2>/dev/null || true
      echo "gaveup cleanup for ${SHA:0:12} (worktree kept for inspection)"
    emit:
      '0': "pr-heal.cleaned.${event.match.1}"
    timeout: 30

# --- conflict heal: merge.conflict → worktree at the LIVE head ---------
# Mirrors pr-heal.worktree, but the checkout rev is the PR's CURRENT
# head (re-resolved via `pr view`), not the event sha — the head may
# have moved between the failed merge and this node firing. The
# worktree dir stays keyed on the event sha so every downstream node
# derives the same path; the merge node persisted the PR number in
# <worktree_base>/conflicts/<sha> (head_sha list-match is the
# fallback). Detached HEAD: the agent merges the base branch in and
# leaves the resolution uncommitted.
- id: pr-heal.conflict.worktree
  driver: shell
  on:
  - pr-heal.merge.conflict.*
  emits:
  - pr-heal.conflict.worktree.ready.*
  - pr-heal.conflict.worktree.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      NUMBER=""
      NUMFILE="${config.worktree_base}/conflicts/${SHA}"
      if [ -f "$NUMFILE" ]; then NUMBER=$(cat "$NUMFILE"); fi
      if [ -z "$NUMBER" ]; then
        JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
        NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      fi
      if [ -z "$NUMBER" ]; then
        echo "no PR recorded/found for conflicted sha $SHA"
        exit 1
      fi
      VIEW=$(lasius --root "${config.lasius_root}" forge pr view "${config.checkout}" "$NUMBER" --json)
      LIVE=$(printf '%s' "$VIEW" | jq -r '.head_sha // empty')
      LIVE="${LIVE:-$SHA}"
      WT="${config.worktree_base}/${SHA:0:12}"
      mkdir -p "${config.worktree_base}"
      lasius --root "${config.lasius_root}" vcs fetch "${config.checkout}" --json >/dev/null
      lasius --root "${config.lasius_root}" vcs worktree remove "${config.checkout}" --dir "$WT" --json >/dev/null 2>&1 || true
      lasius --root "${config.lasius_root}" vcs worktree add "${config.checkout}" --dir "$WT" --rev "$LIVE" --json >/dev/null
      echo "worktree_path=$WT"
      echo "pr_number=$NUMBER"
      echo "head_sha=$LIVE"
    emit:
      '0': "pr-heal.conflict.worktree.ready.${event.match.1}"
      default: "pr-heal.conflict.worktree.failed.${event.match.1}"
    timeout: 120

# --- conflict heal: per-PR attempt ledger -------------------------------
# Same durable-counter pattern as pr-heal.attempts, own file
# (<worktree_base>/attempts/pr-<n>-conflicts) and own cap so heal and
# conflict budgets don't share. Over cap → gaveup.<sha>, terminal.
- id: pr-heal.conflict.attempts
  driver: shell
  on:
  - pr-heal.conflict.worktree.ready.*
  emits:
  - pr-heal.conflict.attempts.ok.*
  - pr-heal.conflict.attempts.gaveup.*
  - pr-heal.conflict.attempts.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      NUMBER=""
      NUMFILE="${config.worktree_base}/conflicts/${SHA}"
      if [ -f "$NUMFILE" ]; then NUMBER=$(cat "$NUMFILE"); fi
      if [ -z "$NUMBER" ]; then
        JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
        NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      fi
      if [ -z "$NUMBER" ]; then
        echo "no PR recorded/found for conflicted sha $SHA"
        exit 1
      fi
      DIR="${config.worktree_base}/attempts"
      FILE="$DIR/pr-$NUMBER-conflicts"
      mkdir -p "$DIR"
      COUNT=$(( $(cat "$FILE" 2>/dev/null || echo 0) + 1 ))
      echo "$COUNT" > "$FILE"
      if [ "$COUNT" -gt "${config.max_conflict_attempts}" ]; then
        echo "pr #$NUMBER conflict attempt $COUNT exceeds cap ${config.max_conflict_attempts} — giving up"
        exit 3
      fi
      echo "pr #$NUMBER conflict attempt $COUNT/${config.max_conflict_attempts}"
    emit:
      '0': "pr-heal.conflict.attempts.ok.${event.match.1}"
      '3': "pr-heal.conflict.attempts.gaveup.${event.match.1}"
      default: "pr-heal.conflict.attempts.failed.${event.match.1}"
    timeout: 60

# --- conflict heal: sepia agent — merge base, resolve, no commit ------
# Same /api/sessions/run pattern as pr-heal.agent (bearer via curl
# --config stdin, mode required, per-sha lock). The agent is the hands:
# it may run git inside the worktree — merge the base branch into HEAD,
# resolve conflicts preserving the PR's intent, verify CI passes — but
# leaves the result uncommitted. `lasius vcs commit` (git add -A +
# git commit) then concludes the in-progress merge and pushes it.
- id: pr-heal.conflict.agent
  driver: shell
  on:
  - pr-heal.conflict.attempts.ok.*
  emits:
  - pr-heal.conflict.agent.done.*
  - pr-heal.conflict.agent.failed.*
  max_fires: 50
  retry:
    max_attempts: 3
    delay: 5000
    backoff: fixed
  params:
    env:
      PRHEAL_TOKEN: "${secret.PEREGRIN_TOKEN}"
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      LOCK="${config.worktree_base}/${SHA:0:12}.agent-lock"
      if ! mkdir "$LOCK" 2>/dev/null; then
        echo "agent already in flight for $SHA"
        exit 1
      fi
      trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
      # Best-effort base-branch name for the prompt.
      BASE="the PR's base branch"
      NUMBER=""
      NUMFILE="${config.worktree_base}/conflicts/${SHA}"
      if [ -f "$NUMFILE" ]; then NUMBER=$(cat "$NUMFILE"); fi
      if [ -n "$NUMBER" ]; then
        VIEW=$(lasius --root "${config.lasius_root}" forge pr view "${config.checkout}" "$NUMBER" --json 2>/dev/null || true)
        B=$(printf '%s' "$VIEW" | jq -r '.base_ref // empty' 2>/dev/null || true)
        if [ -n "$B" ]; then BASE="$B"; fi
      fi
      BODY=$(jq -n \
        --arg cwd "$WT" \
        --arg sha "$SHA" \
        --arg base "$BASE" \
        --arg agent "${config.agent}" \
        --arg mode "${config.agent_mode}" \
        --argjson timeout 1800000 \
        '{cwd:$cwd, agent:$agent, mode:$mode, timeoutMs:$timeout, text:(
          "This worktree holds the head of a pull request whose branch conflicts with its base branch \u0027\($base)\u0027 — the PR cannot be merged until the conflicts are resolved.\n\n" +
          "1. Fetch and integrate the base branch into HEAD (merge \u0027\($base)\u0027 into the current HEAD — do NOT rebase), resolving every conflict so the PR\u0027s intent is preserved.\n" +
          "2. Run the repository CI check and make it pass.\n" +
          "3. Leave the resolution UNCOMMITTED in the working tree — do NOT commit, push, or open a PR; the campaign commits and pushes.\n\n" +
          "If git leaves a merge in progress after you resolve the files, that is expected — leave MERGE_HEAD in place and the resolved files in the tree."
        )}')
      # Bearer via curl --config on stdin: keeps the token out of `ps`
      # argv (same pattern as pr-heal.agent).
      RESP=$(printf 'header = "authorization: Bearer %s"\n' "$PRHEAL_TOKEN" |
        curl -sf --max-time 1900 --config - \
        -X POST "${config.node_url}/api/sessions/run" \
        -H 'content-type: application/json' -d "$BODY")
      echo "$RESP" | jq .
      printf '%s' "$RESP" | jq -e '(.stopReason == "end_turn" or .stopReason == "cancelled") and (.timedOut != true)' >/dev/null
    emit:
      '0': "pr-heal.conflict.agent.done.${event.match.1}"
      default: "pr-heal.conflict.agent.failed.${event.match.1}"
    timeout: 2000

# --- conflict heal: commit + push HEAD to the PR head branch ------------
# Identical contract to pr-heal.push: `vcs commit` stages everything
# and `git commit` concludes the in-progress merge the agent left;
# push is HEAD:refs/heads/<head_ref> so the detached worktree needs
# no local branch. An agent that produced no diff fails the commit
# honestly (no --allow-empty) instead of retriggering CI in a loop.
- id: pr-heal.conflict.push
  driver: shell
  on:
  - pr-heal.conflict.agent.done.*
  emits:
  - pr-heal.conflict.pushed.*
  - pr-heal.conflict.push.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      NUMBER=""
      NUMFILE="${config.worktree_base}/conflicts/${SHA}"
      if [ -f "$NUMFILE" ]; then NUMBER=$(cat "$NUMFILE"); fi
      if [ -z "$NUMBER" ]; then
        JSON=$(lasius --root "${config.lasius_root}" forge pr list "${config.checkout}" --state open --json)
        NUMBER=$(printf '%s' "$JSON" | jq -r --arg sha "$SHA" '[.[] | select(.head_sha == $sha)] | .[0].number // empty')
      fi
      if [ -z "$NUMBER" ]; then
        echo "no PR recorded/found for conflicted sha $SHA — cannot name push branch"
        exit 1
      fi
      VIEW=$(lasius --root "${config.lasius_root}" forge pr view "${config.checkout}" "$NUMBER" --json)
      BRANCH=$(printf '%s' "$VIEW" | jq -r '.head_ref // empty')
      if [ -z "$BRANCH" ]; then
        echo "PR #$NUMBER reports no head_ref — cannot name push branch"
        exit 1
      fi
      lasius --root "${config.lasius_root}" vcs commit "$WT" -m "merge base into PR head to resolve conflicts (pr-heal)" --json
      lasius --root "${config.lasius_root}" vcs push "$WT" --branch "HEAD:refs/heads/$BRANCH" --json
    emit:
      '0': "pr-heal.conflict.pushed.${event.match.1}"
      default: "pr-heal.conflict.push.failed.${event.match.1}"
    timeout: 120

# --- conflict cleanup: worktree + lock after a successful push ---------
- id: pr-heal.conflict.cleanup
  driver: shell
  on:
  - pr-heal.conflict.pushed.*
  emits:
  - pr-heal.conflict.cleaned.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      SHA='${event.match.1}'
      WT="${config.worktree_base}/${SHA:0:12}"
      lasius --root "${config.lasius_root}" vcs worktree remove "${config.checkout}" --dir "$WT" --json >/dev/null 2>&1 || true
      rmdir "${config.worktree_base}/${SHA:0:12}.agent-lock" 2>/dev/null || true
      echo "cleaned $WT"
    emit:
      '0': "pr-heal.conflict.cleaned.${event.match.1}"
    timeout: 60

# --- conflict cleanup: gave up — worktree stays for human inspection ----
- id: pr-heal.conflict.cleanup.gaveup
  driver: shell
  on:
  - pr-heal.conflict.attempts.gaveup.*
  emits:
  - pr-heal.conflict.cleaned.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      SHA='${event.match.1}'
      rmdir "${config.worktree_base}/${SHA:0:12}.agent-lock" 2>/dev/null || true
      echo "conflict gaveup cleanup for ${SHA:0:12} (worktree kept for inspection)"
    emit:
      '0': "pr-heal.conflict.cleaned.${event.match.1}"
    timeout: 30

# --- terminal reporting --------------------------------------------------
- id: pr-heal.report
  driver: shell
  on:
  - pr-heal.merged.*
  - pr-heal.merge.skipped.*
  - pr-heal.merge.failed.*
  - pr-heal.merge.conflict.*
  - pr-heal.pushed.*
  - pr-heal.agent.done.*
  - pr-heal.agent.failed.*
  - pr-heal.attempts.gaveup.*
  - pr-heal.attempts.failed.*
  - pr-heal.worktree.failed.*
  - pr-heal.push.failed.*
  - pr-heal.cleaned.*
  - pr-heal.conflict.worktree.failed.*
  - pr-heal.conflict.attempts.gaveup.*
  - pr-heal.conflict.attempts.failed.*
  - pr-heal.conflict.agent.done.*
  - pr-heal.conflict.agent.failed.*
  - pr-heal.conflict.push.failed.*
  - pr-heal.conflict.pushed.*
  - pr-heal.conflict.cleaned.*
  - node.exhausted
  emits:
  - pr-heal.report.done
  params:
    cmd: |
      echo "pr-heal terminal: ${event.type} sha=${event.match.1:-${event.payload.sha:-?}}"
    emit:
      '0': pr-heal.report.done
    timeout: 30
