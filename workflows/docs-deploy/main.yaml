        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" vcs fetch "$REPO" --json >/dev/null
        # Stale worktree from a superseded/killed run.
        lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$WT" --json >/dev/null 2>&1 || true
        [ ! -e "$WT" ] || rm -rf "$WT"
        lasius --root "$ROOT" vcs worktree add "$REPO" --dir "$WT" --rev "$SHA" --json >/dev/null
        cleanup() {
          lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$WT" --json >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        (
          cd "$WT"
