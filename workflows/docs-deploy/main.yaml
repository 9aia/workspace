        "0": "docs.9aia-lasius.status-posted"

  # 9aia/myco — gen-dependent: D6 dual checkout, docs-branch
  # worktree at <run>/docs + main_ref worktree at <run>.
  - id: docs.9aia-myco
    driver: shell
    on: [push.9aia/myco.refs/heads/docs.**.*]
    max_fires: unlimited
    emits: [docs.9aia-myco.done.*, docs.9aia-myco.failed.*]
    params:
