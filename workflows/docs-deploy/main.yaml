  - id: docs.9aia-github-io.status
    driver: shell
    on: [docs.9aia-github-io.done.*, docs.9aia-github-io.failed.*]
    max_fires: unlimited
    emits: [docs.9aia-github-io.status-posted]
    params:
      timeout: 120
      env:
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.1}'
        case '${event.type}' in
          *.done.*) STATE=success ;;
          *) STATE=failure ;;
        esac
        REPO='9aia.github.io'
        ROOT='${config.lasius_root}'
        ROOT="$(printf '%s' "$ROOT" | sed "s|^~|$HOME|")"
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" forge status create "$REPO" \
          --sha "$SHA" --state "$STATE" \
          --context "${config.context}" \
          --description '${event.type}' \
          --json >/dev/null
      emit:
        "0": "docs.9aia-github-io.status-posted"

  # node.failed events carrying {node, sha} (driver-level failures
  # that never reached the emit map) are remapped onto
  # `<node>.failed.<sha>` so the per-repo verdict sinks see them too
  # (the trailing type segment is the sha; the status nodes' `failed.*`
  # subscription + `${event.match.1}` sha pick it up). Shell-node
  # failures carry {stdout,rc,cmd} — no node/sha — and land on
  # docs.unmapped, same as the old github-status driver's failures.
  - id: docs.failmap
    driver: shell
    on: [node.failed]
    max_fires: unlimited
    emits: [docs.unmapped]
    params:
      cmd: 'test -n "${event.payload.node}" && test -n "${event.payload.sha}"'
      emit:
        "0": "${event.payload.node}.failed.${event.payload.sha}"
        default: "docs.unmapped"
