        lasius --root "$ROOT" vcs fetch "$REPO" --json >/dev/null
        # Stale checkouts from a superseded/killed run —
        # remove registered worktrees first, then plain-dir
        # leftovers. Primary (docs/) before the container
        # run root, same order the git driver tore down.
        lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$DOCS" --json >/dev/null 2>&1 || true
        lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$RUN" --json >/dev/null 2>&1 || true
        [ ! -e "$DOCS" ] || rm -rf "$DOCS"
