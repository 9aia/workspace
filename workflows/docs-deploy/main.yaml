        )
      emit:
        "0": "docs.9aia-peregrin.done.${event.match.2}"
        default: "docs.9aia-peregrin.failed.${event.match.2}"

  - id: docs.9aia-peregrin.pending
    driver: shell
    on: [push.9aia/peregrin.refs/heads/docs.**.*]
    max_fires: unlimited
    emits: [docs.9aia-peregrin.status-posted]
    params:
      timeout: 120
      env:
        # gh api inside `lasius forge` reads GH_TOKEN.
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.2}'
        REPO='peregrin'
        ROOT='${config.lasius_root}'
        ROOT="$(printf '%s' "$ROOT" | sed "s|^~|$HOME|")"
        # The status post resolves owner/repo from the clone's
        # remote — ensure the lasius clone exists first (the deploy
        # node does the same; `lasius add` is a no-op when present).
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" forge status create "$REPO" \
          --sha "$SHA" --state pending \
          --context "${config.context}" \
          --description '${event.type}' \
          --json >/dev/null
      emit:
        "0": "docs.9aia-peregrin.status-posted"

  - id: docs.9aia-peregrin.status
    driver: shell
    on: [docs.9aia-peregrin.done.*, docs.9aia-peregrin.failed.*]
    max_fires: unlimited
    emits: [docs.9aia-peregrin.status-posted]
    params:
      timeout: 120
      env:
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.1}'
        case '${event.type}' in
          *.done.*) STATE=success ;;
          *) STATE=failure ;;
        esac
        REPO='peregrin'
        ROOT='${config.lasius_root}'
        ROOT="$(printf '%s' "$ROOT" | sed "s|^~|$HOME|")"
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" forge status create "$REPO" \
          --sha "$SHA" --state "$STATE" \
          --context "${config.context}" \
          --description '${event.type}' \
          --json >/dev/null
      emit:
        "0": "docs.9aia-peregrin.status-posted"

  - id: docs.9aia-lasius
    driver: shell
    on: [push.9aia/lasius.refs/heads/docs.**.*]
    max_fires: unlimited
    emits: [docs.9aia-lasius.done.*, docs.9aia-lasius.failed.*]
    params:
      # Node cap covers lasius setup (fetch + worktree(s)) +
      # the config.timeout inner deploy + cleanup; the inner
      # cmd's own cap is config.timeout (600).
      timeout: 900
      env:
        BUPHA_TOKEN: "${secret.BUPHA_TOKEN}"
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.2}'
        # Shas are hex — refuse anything else before it can
        # steer the worktree path (rm -rf below).
        case "$SHA" in ''|*[!0-9a-fA-F]*) echo "bad sha '$SHA'"; exit 1 ;; esac
