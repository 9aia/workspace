# docs-deploy — docs-site deployment as a peregrin campaign (PL-009 /
# P-009). A verified `push` to a watched repo's `docs` branch →
# detached worktree at the pushed sha → `bun install` + the repo's own
# `docs:deploy` (vitepress build → `gh-pages`) → GitHub commit status
# under `docs/deploy`.
#
# Boundaries: lasius owns every git/forge call (`lasius vcs fetch` /
# `worktree add|remove` for the checkouts, `lasius forge status
# create` for the commit statuses, `lasius add` for clone-if-missing);
# the deploy command itself is the repo's own `docs:deploy` script.
# Peregrin owns only event routing — no raw git/gh anywhere in this
# file.
#
# Unlike `libraries/ci-gate` this bundle DOES ship its ingress node:
# v1 watches a fixed repo set whose webhook-secret env names follow
# the existing `BUPHA_WH_<OWNER>_<REPO>` convention (names only —
# `capabilities.secrets` grants them; values live in the operator's
# env file, never here). Under `campaign serve` the shared
# `SharedWebhook` demux delivers each verified push to every campaign
# watching the repo, so this file can sit next to `ci-gate-full.yaml`
# on the one listener — the `on:` patterns below match
# `refs/heads/docs` everywhere except 9aia.github.io (whose site IS
# main), so they never collide with ci-gate's `refs/heads/main`.
#
# Scope: self-contained docs trees (sepia/peregrin/lasius — the
# `docs` orphan branch IS the site checkout) plus the gen-dependent
# repos (myco/tamias/cuora/pavo/hypha/sturn/kuda/mimus/bupha) whose
# `docs:deploy` runs `docs:gen`/`docs:api` steps that `cd ..` into
# the main checkout for `cargo run`/`cargo doc`. Those pipelines use
# the D6 dual-checkout layout: the docs-branch worktree lands at
# `<run>/docs` and a second worktree of `config.main_ref` at `<run>`,
# so the gen steps see the same layout as a dev checkout. 9aia.github.io
# is the odd one out: the site lives on `main` (no `docs` branch), so
# its triplet subscribes `refs/heads/main` — self-contained, single
# worktree. Its Pages source must be the `gh-pages` branch (was
# `actions/deploy-pages` artifact deploy — operator switches Pages
# source once; the built output is identical).
#
# Event contract: deploy nodes emit `docs.<repo>.done.<sha>` /
# `docs.<repo>.failed.<sha>` (the sha rides the type, pr-heal style —
# shell events carry no payload.sha for the status nodes to read).
# Verdict statuses map `*.done.*` → success, `*.failed.*` → failure.
name: docs-deploy

# Operator-facing knobs (see params.schema.json + README.md).
config:
  worktree_base: "~/.local/share/peregrin/worktrees"
  # lasius workspace root (`--root`) — repo args are clone names
  # resolved under <lasius_root>/<repos_dir>/<name>. Per-deployment;
  # the org workspace is the natural choice (same as pr-heal).
  lasius_root: "/home/luis/GitHub/9aia/workspace"
  token_env: "BUPHA_TOKEN"          # secret NAME — injected into node env as BUPHA_TOKEN + GH_TOKEN
  timeout: 600                      # inner deploy cap (seconds)
  context: "docs/deploy"            # commit-status context on the pushed repo
  # Rev the gen-dependent nodes' second worktree checks out at <run>.
  # Remote-tracking (`origin/main`) so it reflects the last
  # `lasius vcs fetch` — a local `refs/heads/main` can lag.
  main_ref: "origin/main"
  # The deploy command, run at the worktree root (the docs branch
  # root). `bun install` first — a fresh worktree has no node_modules
  # (`--frozen-lockfile` when bun.lock is committed, plain install as
  # fallback). gh-pages pushes the `gh-pages` branch: the worktree's
  # `origin` is the clone's own remote, and the env-scoped
  # `credential.helper` + author/committer env give the push auth and
  # a commit identity WITHOUT writing the token into any git config.
  # `$BUPHA_TOKEN` is injected via the node's `env:` (secret.BUPHA_TOKEN)
  # — it must match `token_env` above.
  cmd: >-
    bash -lc 'set -e;
    bun install --frozen-lockfile 2>/dev/null || bun install;
    export GIT_CONFIG_COUNT=1
    GIT_CONFIG_KEY_0=credential.helper
    GIT_CONFIG_VALUE_0="!f() { echo username=x-access-token; echo password=$BUPHA_TOKEN; }; f"
    GIT_AUTHOR_NAME=docs-deploy
    GIT_AUTHOR_EMAIL=docs-deploy@users.noreply.github.com
    GIT_COMMITTER_NAME=docs-deploy
    GIT_COMMITTER_EMAIL=docs-deploy@users.noreply.github.com;
    export CARGO_TARGET_DIR="$HOME/.local/share/peregrin/cargo-target";
    bun run docs:deploy'

# Queue policy (docs/reference/queue-supersede.md): pushes on the same
# (repo, ref) are alternative triggers for one logical deploy — the
# newest wins, a newer push cancels the in-flight one.
supersede:
  key: "{repo}:{ref}"
  mode: latest-wins
  cancel_running: true

# Secret NAMES the nodes may resolve — the webhook HMAC secret per
# watched repo plus the forge token (injected as BUPHA_TOKEN for the
# gh-pages push and GH_TOKEN for `gh api` inside lasius forge).
# Values never appear here.
capabilities:
  secrets:
    - BUPHA_TOKEN
    - BUPHA_WH_9AIA_SEPIA
    - BUPHA_WH_9AIA_PEREGRIN
    - BUPHA_WH_9AIA_LASIUS
    - BUPHA_WH_9AIA_MYCO
    - BUPHA_WH_9AIA_TAMIAS
    - BUPHA_WH_9AIA_CUORA
    - BUPHA_WH_9AIA_PAVO
    - BUPHA_WH_9AIA_HYPHA
    - BUPHA_WH_9AIA_STURN
    - BUPHA_WH_9AIA_KUDA
    - BUPHA_WH_9AIA_MIMUS
    - BUPHA_WH_9AIA_BUPHA
    - BUPHA_WH_9AIA_GITHUB_IO

annotations:
  title: Docs deploy
  description: >-
    Push to refs/heads/docs → lasius worktree at sha → bun install +
    docs:deploy (vitepress build → gh-pages) → docs/deploy commit
    status. The GHA deploy.yml replacement as a campaign.
  since: "0.1.0"

nodes:
  # Ingress — one listener, one route per watched repo. `secret_env`
  # names the HMAC secret key resolved through capabilities.secrets.
  # Under `campaign serve` listen/path are ignored (the daemon's
  # --listen/--path govern the shared socket); they matter for a solo
  # `campaign run`.
  - id: docs.ingress.webhook
    driver: github-webhook
    on: [start]
    emits: [docs.ingress.webhook.listening, push]
    params:
      listen: 127.0.0.1:29173
      path: /hook
      repos:
        - name: 9aia/sepia
          secret_env: BUPHA_WH_9AIA_SEPIA
        - name: 9aia/peregrin
          secret_env: BUPHA_WH_9AIA_PEREGRIN
        - name: 9aia/lasius
          secret_env: BUPHA_WH_9AIA_LASIUS
        - name: 9aia/myco
          secret_env: BUPHA_WH_9AIA_MYCO
        - name: 9aia/tamias
          secret_env: BUPHA_WH_9AIA_TAMIAS
        - name: 9aia/cuora
          secret_env: BUPHA_WH_9AIA_CUORA
        - name: 9aia/pavo
          secret_env: BUPHA_WH_9AIA_PAVO
        - name: 9aia/hypha
          secret_env: BUPHA_WH_9AIA_HYPHA
        - name: 9aia/sturn
          secret_env: BUPHA_WH_9AIA_STURN
        - name: 9aia/kuda
          secret_env: BUPHA_WH_9AIA_KUDA
        - name: 9aia/mimus
          secret_env: BUPHA_WH_9AIA_MIMUS
        - name: 9aia/bupha
          secret_env: BUPHA_WH_9AIA_BUPHA
        - name: 9aia/9aia.github.io
          secret_env: BUPHA_WH_9AIA_GITHUB_IO

  # Route every verified push as a typed event
  # `push.<repo>.<ref>.<clone_url>.<sha>` — `on:` matches types only,
  # so the fields ride the type and downstream nodes recover them via
  # ${event.match.N} (`**` re-joins clone_url's `.`-separated
  # segments; the trailing `*` is the sha). Non-docs pushes route but
  # match no subscription and die there.
  - id: docs.route
    driver: shell
    on: [push]
    max_fires: unlimited
    emits: [push.**, route.unmatched]
    params:
      cmd: "true"
      emit:
        "0": "push.${event.payload.repo}.${event.payload.ref}.${event.payload.clone_url}.${event.payload.sha}"
        default: "route.unmatched"

  # --- per-repo deploy pipelines -------------------------------------
  # Each: lasius fetch + worktree(s) at the pushed sha → deploy cmd →
  # pending + verdict statuses via `lasius forge status create`.
  # `on:` pins repo AND refs/heads/docs, so main-branch pushes on the
  # same repos (ci-gate's territory) never fire these.

  - id: docs.9aia-sepia
    driver: shell
    on: [push.9aia/sepia.refs/heads/docs.**.*]
    max_fires: unlimited
    emits: [docs.9aia-sepia.done.*, docs.9aia-sepia.failed.*]
    params:
      # Node cap covers lasius setup (fetch + worktree(s)) +
      # the config.timeout inner deploy + cleanup; the inner
      # cmd's own cap is config.timeout (600).
      timeout: 900
      env:
        BUPHA_TOKEN: "${secret.BUPHA_TOKEN}"
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.2}'
        # Shas are hex — refuse anything else before it can
        # steer the worktree path (rm -rf below).
        case "$SHA" in ''|*[!0-9a-fA-F]*) echo "bad sha '$SHA'"; exit 1 ;; esac
        REPO='sepia'
        # `~` doesn't expand inside "$VAR/…" — expand a
        # leading tilde via sed (`${}`-free so the campaign
        # template doesn't eat the bash expansion).
        expand_tilde() { printf '%s' "$1" | sed "s|^~|$HOME|"; }
        ROOT=$(expand_tilde '${config.lasius_root}')
        BASE=$(expand_tilde '${config.worktree_base}')
        RUN="$BASE/docs-sepia-$SHA"
        WT="$RUN"
        mkdir -p "$BASE"
        # Clone-if-missing — `lasius add` is a no-op when the
        # clone exists (resolves via gh repo list; needs
        # GH_TOKEN, injected above).
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" vcs fetch "$REPO" --json >/dev/null
        # Stale worktree from a superseded/killed run.
        lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$WT" --json >/dev/null 2>&1 || true
        [ ! -e "$WT" ] || rm -rf "$WT"
        lasius --root "$ROOT" vcs worktree add "$REPO" --dir "$WT" --rev "$SHA" --json >/dev/null
        cleanup() {
          lasius --root "$ROOT" vcs worktree remove "$REPO" --dir "$WT" --json >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        (
          cd "$WT"
          ${config.cmd}
        )
      emit:
        "0": "docs.9aia-sepia.done.${event.match.2}"
        default: "docs.9aia-sepia.failed.${event.match.2}"

  - id: docs.9aia-sepia.pending
    driver: shell
    on: [push.9aia/sepia.refs/heads/docs.**.*]
    max_fires: unlimited
    emits: [docs.9aia-sepia.status-posted]
    params:
      timeout: 120
      env:
        # gh api inside `lasius forge` reads GH_TOKEN.
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.2}'
        REPO='sepia'
        ROOT='${config.lasius_root}'
        ROOT="$(printf '%s' "$ROOT" | sed "s|^~|$HOME|")"
        # The status post resolves owner/repo from the clone's
        # remote — ensure the lasius clone exists first (the deploy
        # node does the same; `lasius add` is a no-op when present).
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" forge status create "$REPO" \
          --sha "$SHA" --state pending \
          --context "${config.context}" \
          --description '${event.type}' \
          --json >/dev/null
      emit:
        "0": "docs.9aia-sepia.status-posted"

  - id: docs.9aia-sepia.status
    driver: shell
    on: [docs.9aia-sepia.done.*, docs.9aia-sepia.failed.*]
    max_fires: unlimited
    emits: [docs.9aia-sepia.status-posted]
    params:
      timeout: 120
      env:
        GH_TOKEN: "${secret.BUPHA_TOKEN}"
      cmd: |
        set -euo pipefail
        SHA='${event.match.1}'
        case '${event.type}' in
          *.done.*) STATE=success ;;
          *) STATE=failure ;;
        esac
        REPO='sepia'
        ROOT='${config.lasius_root}'
        ROOT="$(printf '%s' "$ROOT" | sed "s|^~|$HOME|")"
        [ -d "$ROOT/repos/$REPO/.git" ] || lasius --root "$ROOT" add "$REPO" >/dev/null
        lasius --root "$ROOT" forge status create "$REPO" \
          --sha "$SHA" --state "$STATE" \
          --context "${config.context}" \
          --description '${event.type}' \
          --json >/dev/null
      emit:
        "0": "docs.9aia-sepia.status-posted"

  - id: docs.9aia-peregrin
