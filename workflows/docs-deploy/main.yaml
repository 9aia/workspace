        # `~` doesn't expand inside "$VAR/…" — expand a
        # leading tilde via sed (`${}`-free so the campaign
        # template doesn't eat the bash expansion).
        expand_tilde() { printf '%s' "$1" | sed "s|^~|$HOME|"; }
        ROOT=$(expand_tilde '${config.lasius_root}')
        BASE=$(expand_tilde '${config.worktree_base}')
        RUN="$BASE/docs-myco-$SHA"
        DOCS="$RUN/docs"
        mkdir -p "$BASE"
        # Clone-if-missing — `lasius add` is a no-op when the
        # clone exists (resolves via gh repo list; needs
        # GH_TOKEN, injected above).
