# refactor — spec-driven refactor workflow: lasius worktree → sepia
# analyze/implement/fix/review/rework/docs sessions → shell check/test
# gates → pushed branch. Tamias bundle (`type: peregrin-bundle`).
#
# Boundaries: lasius owns every git call, sepia owns every agent
# session (POST /api/sessions/run → sessions.prompt_wait), peregrin
# owns only event routing, tamias distributes.
name: refactor
version: "0.1.0"
type: peregrin-bundle
description: >-
  Spec-driven refactor pipeline — analyze to PLAN.md, implement,
  check/test gates with an agent fix loop, agent review with a rework
  loop, docs pass, then push the branch via lasius. Operator-run
  (on: start); no PR/merge — the pushed branch is the deliverable.

provider:
  # SHARED provider identity — same as pr-heal/ci-gate/ci-ingress/
  # docs-deploy: every peregrin-bundle renders services into the ONE
  # peregrin-campaign.service hosting ~/.config/peregrin/serve/*.yaml
  # on the shared webhook listener. Keep `exec` identical.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Advisory only — refactor is operator-run (on: start), not
    # webhook-driven; nothing registers a hook for this bundle.
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
