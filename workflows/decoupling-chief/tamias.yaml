# decoupling-chief — chief-of-staff monitor for the ecosystem
# decoupling epic (PL-022 / P-042..P-053). Tamias bundle
# (`type: peregrin-bundle`); runs on the SHARED peregrin campaign
# service alongside pr-heal/ci-ingress/docs-deploy.
#
# Boundaries: lasius owns git/worktrees, sepia owns agent sessions,
# myco owns ledger state, peregrin owns only event routing, sturn
# owns claims. No raw git/devin/myco-file edits in this bundle —
# agents act through the ledger verbs.
name: decoupling-chief
version: "0.1.0"
type: peregrin-bundle
description: >-
  Chief-of-staff monitor for the decoupling epic: polls the myco
  ledger for the next ready plan (phase order A→E), launches the
  parameterized extraction subflow (worktree → sepia agent → gates
  → push → handoff), loops until the queue is idle. Long-running —
  host under `campaign serve`; a schedule node re-kicks the scan.

provider:
  # SHARED provider identity — identical to pr-heal/ci-ingress/
  # docs-deploy: one peregrin-campaign.service hosts
  # ~/.config/peregrin/serve/*.yaml on the shared webhook listener.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
