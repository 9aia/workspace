# standard-sweep — fleet `mimus standard` conformance sweep as a
# peregrin campaign.
#
# What it does: runs `scripts/standard.sh` — the org's declared fleet
# sweep (workspace/specs/base.toml floor + each clone's own
# repos/<name>/specs/<name>.toml) — on a nightly schedule and on
# demand (`peregrin campaign run`). This is the 9aia analog of
# handl-lang's workflows/lib/mimus-standard.node.yml leg, lifted from
# per-repo advisory node to fleet sweep: handl-verify is the same
# shape (scheduled campaign wrapping a repo sweep script).
#
# Verdict is REAL, not advisory: standard.sh exits 1 on any
# fail-severity violation → sweep.failed; warn-only runs still exit 0
# (warnings are printed, never gate — same contract as the script).
# A missing mimus binary exits 2 → sweep.failed, so a broken toolchain
# surfaces instead of silently skipping.
#
# Boundaries: no git/forge calls — the sweep reads the dev checkouts
# under <workspace>/repos as they sit. Specs are approval-gated
# (scripts/spec-guard.py); this campaign only READS them.
#
# Triggering: `start` kicks an immediate sweep (on-demand
# `campaign run`/`submit` walks the same path as sweep.due); the
# schedule node re-fires nightly. State is one rolling log —
# <results_dir>/last.log plus last.rc — overwritten each run; the
# campaign's own event history is the audit trail.
name: standard-sweep

# Operator-facing knobs — every ${config.*} lookup below carries an
# env() fallback, so `campaign run` reads STANDARD_SWEEP_* env vars
# (see capabilities.env) and a served/rendered campaign can instead
# pin literal values under config.* (config wins over env()):
#
#   config:
#     cron: "41 4 * * *"               # only knob declared in config:
#
# Every other knob (workspace/mimus/repos/results_dir) resolves
# env() → built-in default and is deliberately NOT declared in
# config: — a set-but-empty config key wins over the env() fallback.
#
# NOTE: params.timeout must be an integer literal — no templating —
# so the per-run cap is fixed at 1800s on sweep.run.

capabilities:
  env:
    - STANDARD_SWEEP_WORKSPACE
    - STANDARD_SWEEP_CRON
    - STANDARD_SWEEP_MIMUS
    - STANDARD_SWEEP_REPOS
    - STANDARD_SWEEP_RESULTS_DIR

config:
  cron: "41 4 * * *"

nodes:
  # --- schedule: nightly sweep --------------------------------------
  - id: sweep.schedule
    driver: schedule
    on: [start]
    emits: [sweep.due]
    params:
      cron: '${config.cron:-${env("STANDARD_SWEEP_CRON","41 4 * * *")}}'
      timezone: "America/Sao_Paulo"

  # --- run: scripts/standard.sh over the fleet ----------------------
  # `start` is in `on:` so `peregrin campaign run` sweeps immediately;
  # sweep.due is the nightly tick. Output tees to last.log so the
  # verdict survives the campaign log's rotation; last.rc records the
  # script's exit code for cheap polling.
  - id: sweep.run
    driver: shell
    on: [start, sweep.due]
    emits: [sweep.done, sweep.failed]
    max_fires: 500
    params:
      # Literal block (|) — the script keeps its own comments/loops.
      cmd: |
        set -uo pipefail
        WS="${config.workspace:-${env("STANDARD_SWEEP_WORKSPACE","$HOME/GitHub/9aia/workspace")}}"
        RES="${config.results_dir:-${env("STANDARD_SWEEP_RESULTS_DIR","$HOME/.local/share/standard-sweep")}}"
        # NB: workspace/mimus/repos are deliberately NOT declared in
        # config: — a set-but-empty config key wins over the env()
        # fallback, so only knobs with real defaults live there.
        MIMUS="${config.mimus:-${env("STANDARD_SWEEP_MIMUS","")}}"
        REPOS="${config.repos:-${env("STANDARD_SWEEP_REPOS","")}}"
        mkdir -p "$RES"
        cd "$WS" || { echo "standard-sweep: no workspace at $WS"; exit 1; }
        export MIMUS
        LOG="$RES/last.log"
        echo "standard-sweep: $(date -Is) ws=$WS mimus=${MIMUS:-auto} repos=${REPOS:-all}" | tee "$LOG"
        # shellcheck disable=SC2086 — REPOS is a deliberate word-split list
        if [ -n "$REPOS" ]; then
          scripts/standard.sh $REPOS 2>&1 | tee -a "$LOG"
        else
          scripts/standard.sh 2>&1 | tee -a "$LOG"
        fi
        rc=${PIPESTATUS[0]}
        echo "$rc" > "$RES/last.rc"
        echo "standard-sweep: rc=$rc log=$LOG"
        [ "$rc" -eq 0 ]
      emit:
        "0": sweep.done
        default: sweep.failed
      timeout: 1800
