# kill-mutants — StrykerJS mutation testing → sepia agent triage →
# tests/disable-comments → push → PR. Operator-triggered: an injected
# `mutate.requested` event (POST /api/events/inject) carries
# {id, package, checkout, base_branch}; no webhook ingress.
#
# Flow (one request = one `.<id>` suffix riding every event type):
#   mutate.requested ──route──► requested.<id> ──► worktree (lasius
#   fetch + detached worktree at origin/<base_branch>; re-checks
#   stryker.conf.json there — the authoritative gate) ──► install
#   (config.install_cmd) ──► mutate (config.mutate_cmd in <pkg>,
#   report must land at <pkg>/<mutate_report>) ──► summarize (jq →
#   counts + detail file; zero actionable → summarize.clean) ──►
#   agent (sepia /api/sessions/run — kill survivors with tests;
#   disable only proven-equivalent) ──► lasius commit + push
#   HEAD:refs/heads/test/<id> ──► lasius forge pr create ──►
#   cleanup ──► report
#
# Boundaries: lasius owns git/forge, sepia owns the agent session,
# peregrin owns routing. No raw git/gh/devin. Stateless like pr-heal:
# route persists requests/<id>.env (no stdout→state channel); every
# node re-sources it.
name: kill-mutants

annotations:
  title: Mutation testing — StrykerJS survivors to agent-killed tests
  description: >-
    Operator-injected mutate.requested event → lasius worktree →
    bun install + stryker run → survivor summary → sepia agent triage
    (kill with tests, disable only proven-equivalent mutants) →
    lasius commit/push → lasius forge PR → report.
  author: 9aia
  tags: [mutation-testing, stryker, agent, workflow]
  since: "0.1.0"

# Operator-facing knobs (see params.schema.json + README.md). Per-run
# values (id/package/checkout/base_branch) arrive on the
# mutate.requested payload; these are deployment defaults.
config:
  # Fallback clone path when the payload omits `checkout` (absolute path).
  checkout: ""
  # lasius workspace root (--root) for all vcs/forge calls.
  lasius_root: "/home/luis/GitHub/9aia/workspace"
  # wt-<id> worktrees; requests/, reports/ artifacts live alongside.
  worktree_base: "$HOME/.local/share/kill-mutants/worktrees"
  # `peregrin serve` sessions plane; bearer = PEREGRIN_TOKEN.
  node_url: "http://127.0.0.1:18787"
  # Dependency install at the worktree root (override per repo).
  install_cmd: "bun install --frozen-lockfile"
  # Mutation command, cwd=<worktree>/<package>. MUST exit 0 on a
  # completed run — no thresholds.break in stryker.conf.json.
  mutate_cmd: "bun run mutate"
  # Stryker jsonReporter output, relative to the package dir.
  mutate_report: "reports/mutation/mutation.json"
  # Mutant statuses handed to the agent (Ignored/CompileError/
  # RuntimeError excluded — deliberate or harness problems).
  actionable_statuses: '["Survived","Timeout","NoCoverage"]'
  # Cap on actionable-mutant lines in the agent prompt.
  summary_max_lines: 300
  # Head-branch prefix: pushed branch is <branch_prefix>/<id>.
  branch_prefix: "test"
  # Fallback PR base when the payload omits `base_branch`.
  default_branch: "main"
  # sepia agent-config id for the triage session.
  agent: "devin"
  # ACP mode — REQUIRED unattended (devin's default prompts on exec
  # and deadlocks). bypass = auto-approve all; smart = middle ground.
  agent_mode: "bypass"
  # Agent session timeout (ms); curl --max-time derives from it.
  agent_timeout_ms: 3600000

capabilities:
  secrets:
    - PEREGRIN_TOKEN

# EXTERNAL event — operator POSTs it to /api/events/inject on the
# shared campaign listener. Declared so validate wires route's
# subscription. Payload (strings; checkout/base_branch optional —
# config fallbacks apply):
#   id           REQUIRED — [A-Za-z0-9][A-Za-z0-9._-]{0,63}; keys
#                wt-<id>, requests/<id>.env and branch test/<id>.
#                Unique per run (nothing dedups on it).
#   package      REQUIRED — dir relative to checkout root containing
#                stryker.conf.json (e.g. "packages/crypto").
#   checkout     local clone path lasius operates on.
#   base_branch  PR base / worktree rev.
# idempotencyKey on the inject body dedups transport retries.
events:
- type: mutate.requested
  fields:
    id: string
    package: string
    checkout: string
    base_branch: string

# No supersede — requests are independent operator actions keyed by id.

nodes:
# route: validate payload, persist requests/<id>.env. stryker.conf.json
# is NOT checked here (checkout's current branch may be stale) — the
# worktree node re-checks it on the fresh origin/<base> worktree.
- id: kill-mutants.route
  driver: shell
  on:
  - mutate.requested
  emits:
  - kill-mutants.requested.*
  - kill-mutants.request.invalid
  - kill-mutants.request.failed
  max_fires: unlimited
  params:
    env:
      KM_ID: "${event.payload.id}"
      KM_PACKAGE: "${event.payload.package}"
      KM_CHECKOUT: "${event.payload.checkout}"
      KM_BASE_BRANCH: "${event.payload.base_branch}"
    cmd: |
      set -euo pipefail
      fail() { echo "invalid mutate.requested: $1"; exit 2; }
      ID="$KM_ID"
      PACKAGE="$KM_PACKAGE"
      CHECKOUT="${KM_CHECKOUT:-${config.checkout}}"
      BASE="${KM_BASE_BRANCH:-${config.default_branch}}"
      BRANCH="${config.branch_prefix}/${ID}"
      [ -n "$ID" ] || fail "missing id"
      [[ "$ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fail "id '$ID' must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}"
      [ -n "$PACKAGE" ] || fail "missing package"
      [[ "$PACKAGE" =~ ^[A-Za-z0-9._/@-]+(/[A-Za-z0-9._/@-]+)*$ ]] || fail "package '$PACKAGE' must be a relative path of [A-Za-z0-9._/@-] segments"
      case "$PACKAGE" in *..*) fail "package must not contain '..'" ;; esac
      [ -n "$CHECKOUT" ] || fail "missing checkout (payload.checkout or config.checkout)"
      # Values are single-quoted into the env file — reject quotes
      # and newlines up front rather than escaping.
      for v in "$ID" "$PACKAGE" "$CHECKOUT" "$BASE"; do
        case "$v" in *"'"*|*$'\n'*) fail "value contains a quote or newline" ;; esac
      done
      mkdir -p "${config.worktree_base}/requests"
      {
        printf "KM_ID='%s'\n" "$ID"
        printf "KM_PACKAGE='%s'\n" "$PACKAGE"
        printf "KM_CHECKOUT='%s'\n" "$CHECKOUT"
        printf "KM_BASE_BRANCH='%s'\n" "$BASE"
        printf "KM_BRANCH='%s'\n" "$BRANCH"
      } > "${config.worktree_base}/requests/${ID}.env"
      echo "request $ID accepted: package=$PACKAGE checkout=$CHECKOUT base=$BASE"
    emit:
      '0': "kill-mutants.requested.${event.payload.id}"
      '2': kill-mutants.request.invalid
      default: kill-mutants.request.failed
    timeout: 60

# worktree: detached at origin/<base_branch> (pr-heal style — a stale
# local test/<id> branch would collide with --branch; push targets
# HEAD:refs/heads/<branch> instead). stryker.conf.json is checked
# here against the fresh worktree — the authoritative gate.
- id: kill-mutants.worktree
  driver: shell
  on:
  - kill-mutants.requested.*
  emits:
  - kill-mutants.worktree.ready.*
  - kill-mutants.worktree.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      mkdir -p "${config.worktree_base}"
      lasius --root "${config.lasius_root}" vcs fetch "$KM_CHECKOUT" --json >/dev/null
      lasius --root "${config.lasius_root}" vcs worktree remove "$KM_CHECKOUT" --dir "$WT" --json >/dev/null 2>&1 || true
      lasius --root "${config.lasius_root}" vcs worktree add "$KM_CHECKOUT" --dir "$WT" --rev "origin/${KM_BASE_BRANCH}" --json >/dev/null
      [ -f "$WT/$KM_PACKAGE/stryker.conf.json" ] || { echo "worktree lacks $KM_PACKAGE/stryker.conf.json at origin/${KM_BASE_BRANCH}"; exit 1; }
      echo "worktree ready: $WT (detached at origin/${KM_BASE_BRANCH}, push → $KM_BRANCH)"
    emit:
      '0': "kill-mutants.worktree.ready.${event.match.1}"
      default: "kill-mutants.worktree.failed.${event.match.1}"
    timeout: 120

# install: fresh worktrees have no node_modules — install before stryker.
- id: kill-mutants.install
  driver: shell
  on:
  - kill-mutants.worktree.ready.*
  emits:
  - kill-mutants.install.done.*
  - kill-mutants.install.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      cd "$WT"
      ${config.install_cmd}
    emit:
      '0': "kill-mutants.install.done.${event.match.1}"
      default: "kill-mutants.install.failed.${event.match.1}"
    timeout: 900

# mutate: cwd=<worktree>/<package>; log teed to reports/<id>-mutate.log.
# Requires rc 0 (no thresholds.break) AND a parseable JSON report.
- id: kill-mutants.mutate
  driver: shell
  on:
  - kill-mutants.install.done.*
  emits:
  - kill-mutants.mutate.done.*
  - kill-mutants.mutate.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      mkdir -p "${config.worktree_base}/reports"
      LOG="${config.worktree_base}/reports/${ID}-mutate.log"
      cd "$WT/$KM_PACKAGE"
      RC=0
      ${config.mutate_cmd} 2>&1 | tee "$LOG" || RC=$?
      tail -n 40 "$LOG"
      REPORT="$WT/$KM_PACKAGE/${config.mutate_report}"
      if [ "$RC" -ne 0 ]; then
        echo "mutate exited $RC (log: $LOG)"
        exit 1
      fi
      if [ ! -f "$REPORT" ]; then
        echo "mutate exited 0 but no report at $REPORT (log: $LOG)"
        exit 1
      fi
      jq -e . "$REPORT" >/dev/null || { echo "report at $REPORT is not valid JSON"; exit 1; }
      echo "mutation report: $REPORT"
    emit:
      '0': "kill-mutants.mutate.done.${event.match.1}"
      default: "kill-mutants.mutate.failed.${event.match.1}"
    timeout: 3900

# summarize: copies the report out of the worktree and writes
# <id>-mutants.txt (counts + one line per actionable mutant). Zero
# actionable → exit 3 → summarize.clean.<id> (terminal, no agent).
- id: kill-mutants.summarize
  driver: shell
  on:
  - kill-mutants.mutate.done.*
  emits:
  - kill-mutants.summarize.done.*
  - kill-mutants.summarize.clean.*
  - kill-mutants.summarize.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      REPORT="$WT/$KM_PACKAGE/${config.mutate_report}"
      OUTDIR="${config.worktree_base}/reports"
      mkdir -p "$OUTDIR"
      COPY="$OUTDIR/${ID}-mutation.json"
      DETAIL="$OUTDIR/${ID}-mutants.txt"
      cp "$REPORT" "$COPY"
      ACTIONABLE='${config.actionable_statuses}'
      TOTAL=$(jq '[.files[].mutants[]] | length' "$REPORT")
      COUNT=$(jq --argjson a "$ACTIONABLE" '[.files[].mutants[] | select(.status as $s | $a | index($s))] | length' "$REPORT")
      {
        echo "package: $KM_PACKAGE"
        echo "branch: $KM_BRANCH (base origin/$KM_BASE_BRANCH)"
        echo "worktree: $WT"
        echo "report copy: $COPY"
        echo "total mutants: $TOTAL"
        echo "actionable (Survived/Timeout/NoCoverage): $COUNT"
        echo
        echo "status counts:"
        jq -r '[.files[].mutants[].status] | group_by(.) | .[] | "\(.[0])\t\(length)"' "$REPORT" | sort
        echo
        echo "actionable mutants (file:line [mutator] status — reason → replacement):"
        ( jq -r --argjson a "$ACTIONABLE" '
            .files | to_entries[] | .key as $f | .value.mutants[] |
            select(.status as $s | $a | index($s)) |
            "\($f):\(.location.start.line) [\(.mutatorName)] \(.status)" +
            (if (.statusReason // "") != "" then " — \(.statusReason[0:200])" else "" end) +
            (if .replacement != null then " → \(.replacement | tostring | .[0:120])" else "" end)
          ' "$REPORT" | head -n "${config.summary_max_lines}" ) || true
      } > "$DETAIL"
      echo "wrote $DETAIL — $COUNT actionable of $TOTAL mutants"
      if [ "$COUNT" -eq 0 ]; then
        echo "no actionable mutants — nothing for the agent to do"
        exit 3
      fi
    emit:
      '0': "kill-mutants.summarize.done.${event.match.1}"
      '3': "kill-mutants.summarize.clean.${event.match.1}"
      default: "kill-mutants.summarize.failed.${event.match.1}"
    timeout: 120

# agent: sepia session (same /api/sessions/run mechanics as
# pr-heal.agent — bearer via curl --config stdin, mode REQUIRED for
# unattended turns, per-id lock). Prompt carries the survivor detail
# file + the strict equivalence rule.
- id: kill-mutants.agent
  driver: shell
  on:
  - kill-mutants.summarize.done.*
  emits:
  - kill-mutants.agent.done.*
  - kill-mutants.agent.failed.*
  # Operator-driven flow — max_fires is a campaign-lifetime circuit
  # breaker only; per-run bounding is the unique-id contract.
  max_fires: 50
  retry:
    max_attempts: 3
    delay: 5000
    backoff: fixed
  params:
    env:
      KILLMUTANTS_TOKEN: "${secret.PEREGRIN_TOKEN}"
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      DETAIL="${config.worktree_base}/reports/${ID}-mutants.txt"
      LOCK="${config.worktree_base}/wt-${ID}.agent-lock"
      if ! mkdir "$LOCK" 2>/dev/null; then
        echo "agent already in flight for $ID"
        exit 1
      fi
      trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
      SUMMARY=$(cat "$DETAIL")
      TIMEOUT_S=$(( ${config.agent_timeout_ms} / 1000 + 100 ))
      BODY=$(jq -n \
        --arg cwd "$WT" \
        --arg pkg "$KM_PACKAGE" \
        --arg branch "$KM_BRANCH" \
        --arg base "$KM_BASE_BRANCH" \
        --arg summary "$SUMMARY" \
        --arg agent "${config.agent}" \
        --arg mode "${config.agent_mode}" \
        --argjson timeout "${config.agent_timeout_ms}" \
        '{cwd:$cwd, agent:$agent, mode:$mode, timeoutMs:$timeout, text:(
          "Mutation testing (StrykerJS) found surviving mutants in package \u0027" + $pkg + "\u0027.\n" +
          "Worktree: " + $cwd + " (branch " + $branch + ", based on origin/" + $base + ").\n\n" +
          "Your job: kill the surviving mutants. For EACH actionable mutant in the summary below:\n" +
          "1. Read the mutant location and the surrounding code.\n" +
          "2. Add or strengthen tests so the suite fails on the mutated code — that is what kills a mutant.\n" +
          "3. Re-run the package\u0027s test suite to verify; you may also re-run the mutation suite to confirm kills.\n\n" +
          "Equivalence rule — STRICT: you may silence a mutant with a `// Stryker disable next-line <mutator>: <reason>` comment ONLY after empirically proving the mutant is equivalent or unreachable (e.g. a probe test run against the mutated code, or a demonstrated unreachable path). Never assume equivalence — if you cannot prove it, write the killing test instead. Prefer killing mutants over disabling them.\n\n" +
          "If a mutant exposes a real bug rather than a coverage gap, fix the bug and call it out in your final message.\n\n" +
          "Constraints:\n" +
          "- Work inside package \u0027" + $pkg + "\u0027 (plus repo-root changes its tests require, e.g. shared test helpers or lockfile entries).\n" +
          "- English everywhere; follow the repo\u0027s existing test conventions and style.\n" +
          "- Do NOT commit, push, or open a PR, and do NOT run git/lasius/forge commands — the campaign owns all git and forge operations. Leave changes in the working tree.\n" +
          "- Do NOT modify production source except to add Stryker disable comments for proven-equivalent mutants (or a real bug fix); the deliverable is tests, not refactors.\n\n" +
          "Surviving-mutant report:\n\n" + $summary
        )}')
      # Bearer via curl --config on stdin: keeps the token out of `ps`
      # argv (same pattern as pr-heal.agent).
      RESP=$(printf 'header = "authorization: Bearer %s"\n' "$KILLMUTANTS_TOKEN" |
        curl -sf --max-time "$TIMEOUT_S" --config - \
        -X POST "${config.node_url}/api/sessions/run" \
        -H 'content-type: application/json' -d "$BODY")
      echo "$RESP" | jq .
      printf '%s' "$RESP" | jq -e '(.stopReason == "end_turn" or .stopReason == "cancelled") and (.timedOut != true)' >/dev/null
    emit:
      '0': "kill-mutants.agent.done.${event.match.1}"
      default: "kill-mutants.agent.failed.${event.match.1}"
    timeout: 3960

# push: no --allow-empty — an agent that produced no diff fails the
# commit honestly instead of opening an empty PR.
- id: kill-mutants.push
  driver: shell
  on:
  - kill-mutants.agent.done.*
  emits:
  - kill-mutants.pushed.*
  - kill-mutants.push.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      lasius --root "${config.lasius_root}" vcs commit "$WT" \
        -m "test($KM_PACKAGE): kill surviving mutants" \
        --body "Mutation-testing survivors triaged by a sepia agent session — new/strengthened tests, plus Stryker disable comments only for empirically-proven equivalent mutants. Generated with the kill-mutants workflow bundle" \
        --json
      lasius --root "${config.lasius_root}" vcs push "$WT" \
        --branch "HEAD:refs/heads/$KM_BRANCH" --json
    emit:
      '0': "kill-mutants.pushed.${event.match.1}"
      default: "kill-mutants.push.failed.${event.match.1}"
    timeout: 120

# pr: the pushed branch is not the deliverable — the PR is.
- id: kill-mutants.pr
  driver: shell
  on:
  - kill-mutants.pushed.*
  emits:
  - kill-mutants.pr.created.*
  - kill-mutants.pr.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      DETAIL="${config.worktree_base}/reports/${ID}-mutants.txt"
      PR_BODY=$(printf '## Summary\n\nMutation-testing (StrykerJS) survivors in `%s` were triaged by an agent session: real gaps were killed with new or strengthened tests; mutants were silenced with `// Stryker disable` comments only where equivalence/unreachability was verified empirically.\n\n- Package: `%s`\n- Branch: `%s`\n- Base: `%s`\n\nFull surviving-mutant detail is preserved in the campaign artifacts (`%s-mutants.txt`).\n\nGenerated with the kill-mutants workflow bundle' \
        "$KM_PACKAGE" "$KM_PACKAGE" "$KM_BRANCH" "$KM_BASE_BRANCH" "$ID")
      lasius --root "${config.lasius_root}" forge pr create "$WT" \
        --title "test($KM_PACKAGE): kill surviving mutants" \
        --body "$PR_BODY" \
        --base "$KM_BASE_BRANCH" \
        --head "$KM_BRANCH" \
        --json
    emit:
      '0': "kill-mutants.pr.created.${event.match.1}"
      default: "kill-mutants.pr.failed.${event.match.1}"
    timeout: 120

# cleanup: deliverable is on the remote OR the run is terminal —
# every post-route outcome removes the worktree, agent session, and
# lock. Artifacts live OUTSIDE the worktree under
# <worktree_base>/{requests,reports}.
- id: kill-mutants.cleanup
  driver: shell
  on:
  - kill-mutants.pr.created.*
  - kill-mutants.summarize.clean.*
  - kill-mutants.worktree.failed.*
  - kill-mutants.install.failed.*
  - kill-mutants.mutate.failed.*
  - kill-mutants.summarize.failed.*
  - kill-mutants.agent.failed.*
  - kill-mutants.push.failed.*
  - kill-mutants.pr.failed.*
  emits:
  - kill-mutants.cleaned.*
  - kill-mutants.cleanup.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      lasius --root "${config.lasius_root}" vcs worktree remove "$KM_CHECKOUT" --dir "$WT" --json >/dev/null 2>&1 || true
      rmdir "${config.worktree_base}/wt-${ID}.agent-lock" 2>/dev/null || true
      # Session hygiene: the triage session's cwd was the worktree —
      # drop it with the worktree. A gc failure is reported as
      # cleanup.failed.* (not silence) — devin-gc refuses open
      # sessions, so a live session surfaces here honestly.
      if devin-gc --cwd "$WT" --apply; then
        echo "cleaned $WT"
        exit 0
      fi
      echo "session cleanup failed for $WT" >&2
      exit 4
    emit:
      '0': "kill-mutants.cleaned.${event.match.1}"
      '4': "kill-mutants.cleanup.failed.${event.match.1}"
    timeout: 60

# --- terminal reporting --------------------------------------------------
- id: kill-mutants.report
  driver: shell
  on:
  - kill-mutants.request.invalid
  - kill-mutants.request.failed
  - kill-mutants.worktree.failed.*
  - kill-mutants.install.failed.*
  - kill-mutants.mutate.failed.*
  - kill-mutants.summarize.failed.*
  - kill-mutants.agent.failed.*
  - kill-mutants.push.failed.*
  - kill-mutants.pr.failed.*
  - kill-mutants.cleaned.*
  - kill-mutants.cleanup.failed.*
  - node.exhausted
  emits:
  - kill-mutants.report.done
  params:
    cmd: |
      echo "kill-mutants terminal: ${event.type} id=${event.match.1:-?}"
    emit:
      '0': kill-mutants.report.done
    timeout: 30
