# kill-mutants — StrykerJS mutation testing → sepia agent triage →
# tests/disable-comments → push → PR. Operator-triggered: an external
# `mutate.requested` event (POST /api/events/inject on the campaign
# listener) carries {id, package, checkout, base_branch}; there is no
# webhook ingress and no polling.
#
# Flow (one request = one `.<id>` suffix riding every event type):
#   mutate.requested ──route──► requested.<id> ──► worktree
#   (lasius fetch + worktree add --branch test/<id> at
#   origin/<base_branch>; stryker.conf.json must exist) ──►
#   install (config.install_cmd at worktree root — bun
#   --frozen-lockfile by default) ──► mutate (config.mutate_cmd inside
#   <pkg>, generous timeout, report must land at
#   <pkg>/<mutate_report>) ──► summarize (jq mutation.json → per-status
#   counts + actionable-mutant detail file; zero actionable →
#   summarize.clean.<id>, terminal) ──► agent (sepia
#   POST /api/sessions/run — kill survivors with tests; Stryker
#   disable comments ONLY for empirically-proven equivalent/unreachable
#   mutants) ──► commit + push HEAD:refs/heads/test/<id> (lasius) ──►
#   forge pr create (lasius, --base <base_branch>) ──► cleanup
#   worktree ──► report
#
# Boundaries: lasius owns every git/forge call (worktree, commit,
# push, PR create), sepia owns the agent session (via the node's POST
# /api/sessions/run), peregrin owns only event routing, tamias
# distributes. No raw git/gh/devin anywhere in this file.
#
# Stateless like pr-heal/new-feat: the Rust engine has no
# stdout→state channel, so the request payload is persisted once by
# the route node to <worktree_base>/requests/<id>.env and every
# downstream node re-sources it (same pattern as pr-heal's per-PR
# attempt ledger / conflict PR-number files). The `.<id>` suffix on
# event types is the correlation key (`${event.match.1}`).
#
# Operator invocation (see README.md):
#   curl -X POST http://127.0.0.1:29173/api/events/inject \
#     -H "authorization: Bearer $PEREGRIN_TOKEN" \
#     -H 'content-type: application/json' \
#     -d '{"type":"mutate.requested","payload":{"id":"crypto-mutation",
#          "package":"packages/crypto",
#          "checkout":"/path/to/clone",
#          "base_branch":"main"},"idempotencyKey":"crypto-mutation-1"}'
name: kill-mutants

annotations:
  title: Mutation testing — StrykerJS survivors to agent-killed tests
  description: >-
    Operator-injected mutate.requested event → lasius worktree →
    bun install + stryker run → survivor summary → sepia agent triage
    (kill with tests, disable only proven-equivalent mutants) →
    lasius commit/push → lasius forge PR → report.
  author: 9aia
  tags: [mutation-testing, stryker, agent, workflow]
  since: "0.1.0"

# Operator-facing knobs (see params.schema.json + README.md). Per-run
# values (id/package/checkout/base_branch) arrive on the
# mutate.requested payload; these are deployment defaults.
config:
  # Fallback local clone path when the event payload omits
  # `checkout`. lasius accepts a repos_dir clone name or a checkout
  # path — a real path is required here because the route node stats
  # <checkout>/<package>/stryker.conf.json before accepting.
  checkout: ""
  # lasius workspace root (--root) — repo args are checkout paths,
  # so any lasius.toml workspace works; the org workspace is the
  # natural choice.
  lasius_root: "/home/luis/GitHub/9aia/workspace"
  # Worktrees land at <worktree_base>/wt-<id>; per-run request env
  # files, mutant summaries and report copies land under
  # <worktree_base>/{requests,reports}.
  worktree_base: "$HOME/.local/share/kill-mutants/worktrees"
  # Base URL of `peregrin serve` — sessions plane. Agent nodes POST
  # /api/sessions/run here; bearer = PEREGRIN_TOKEN.
  node_url: "http://127.0.0.1:18787"
  # Dependency install run at the worktree ROOT before mutate.
  # ktbhealth/product is a bun monorepo — frozen lockfile keeps the
  # worktree reproducible. Override per repo (npm/pnpm/cargo …).
  install_cmd: "bun install --frozen-lockfile"
  # Mutation command run with cwd=<worktree>/<package>. MUST exit 0
  # on a completed run — StrykerJS does unless the repo sets a
  # thresholds.break value in stryker.conf.json (do not). The node
  # also requires <mutate_report> to exist and parse as JSON.
  mutate_cmd: "bun run mutate"
  # Stryker jsonReporter output, relative to the package dir.
  mutate_report: "reports/mutation/mutation.json"
  # Mutant statuses handed to the agent. Survived = real gap; Timeout
  # = test too slow / mutant hangs; NoCoverage = mutant in code no
  # test reaches. Ignored/CompileError/RuntimeError are excluded —
  # the first is deliberate, the latter two are harness problems a
  # test-writing pass cannot fix.
  actionable_statuses: '["Survived","Timeout","NoCoverage"]'
  # Cap on actionable-mutant lines written into the agent prompt
  # summary (the full detail file is kept under worktree_base).
  summary_max_lines: 300
  # Branch prefix — the pushed head branch is <branch_prefix>/<id>.
  # Convention: pick id like "<pkg>-mutation" → test/<pkg>-mutation.
  branch_prefix: "test"
  # Fallback PR base branch when the payload omits `base_branch`.
  default_branch: "main"
  # sepia agent-config id for the triage session (e.g. devin).
  agent: "devin"
  # ACP session mode applied via session/set_mode — REQUIRED for
  # unattended runs: devin's default accept-edits prompts on exec
  # and nothing answers, deadlocking the turn. "bypass"
  # auto-approves everything (fine inside a disposable worktree);
  # "smart" is the safer middle ground.
  agent_mode: "bypass"
  # Agent session timeout (ms) — mutant triage across a whole package
  # is long; the curl --max-time is derived from it (+100s).
  agent_timeout_ms: 1800000

capabilities:
  secrets:
    - PEREGRIN_TOKEN

# Declared event contracts. `mutate.requested` is EXTERNAL — no node
# emits it; an operator (or ops tooling) POSTs it to the campaign
# host's `/api/events/inject` (campaign serve's shared listener) and
# it lands on the trigger channel like a bupha ci.job.completed
# delivery. Declared here so `campaign validate` wires
# kill-mutants.route's subscription and the payload shape is
# documented. Payload (all strings; checkout/base_branch optional —
# config.checkout/config.default_branch are the fallbacks):
#   id           REQUIRED — run id, [A-Za-z0-9][A-Za-z0-9._-]{0,63};
#                becomes <worktree_base>/wt-<id>, requests/<id>.env
#                and branch <branch_prefix>/<id>. Unique per run.
#   package      REQUIRED — package dir relative to the checkout
#                root containing stryker.conf.json (e.g.
#                "packages/crypto").
#   checkout     local clone path lasius operates on.
#   base_branch  PR base / worktree rev (default config.default_branch).
# `idempotencyKey` on the inject body dedups transport retries; `id`
# must still be unique per logical run — nothing dedups on it.
events:
- type: mutate.requested
  fields:
    id: string
    package: string
    checkout: string
    base_branch: string

# No supersede: requests are independent operator actions keyed by
# their own id; a re-run with the same id reuses the deterministic
# worktree path (stale worktree removed, branch re-created — see
# README safety notes).

nodes:
# --- route: validate + persist the request -----------------------------
# The ONLY node that sees the raw payload. Validates the contract
# (id charset — it rides every downstream event type as
# `${event.match.1}`, package is a safe relative path, checkout has
# the stryker.conf.json the flow requires), then writes
# <worktree_base>/requests/<id>.env — the single source every later
# node re-sources (no stdout→state channel in the Rust engine).
# Emits requested.<id> on success; request.invalid (bad/missing
# fields, no stryker.conf.json) and request.failed (infra) are
# terminal reports. Exit 2 = invalid payload, anything else = failed.
- id: kill-mutants.route
  driver: shell
  on:
  - mutate.requested
  emits:
  - kill-mutants.requested.*
  - kill-mutants.request.invalid
  - kill-mutants.request.failed
  max_fires: unlimited
  params:
    env:
      KM_ID: "${event.payload.id}"
      KM_PACKAGE: "${event.payload.package}"
      KM_CHECKOUT: "${event.payload.checkout}"
      KM_BASE_BRANCH: "${event.payload.base_branch}"
    cmd: |
      set -euo pipefail
      fail() { echo "invalid mutate.requested: $1"; exit 2; }
      ID="$KM_ID"
      PACKAGE="$KM_PACKAGE"
      CHECKOUT="${KM_CHECKOUT:-${config.checkout}}"
      BASE="${KM_BASE_BRANCH:-${config.default_branch}}"
      BRANCH="${config.branch_prefix}/${ID}"
      [ -n "$ID" ] || fail "missing id"
      [[ "$ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fail "id '$ID' must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}"
      [ -n "$PACKAGE" ] || fail "missing package"
      [[ "$PACKAGE" =~ ^[A-Za-z0-9._/@-]+(/[A-Za-z0-9._/@-]+)*$ ]] || fail "package '$PACKAGE' must be a relative path of [A-Za-z0-9._/@-] segments"
      case "$PACKAGE" in *..*) fail "package must not contain '..'" ;; esac
      [ -n "$CHECKOUT" ] || fail "missing checkout (payload.checkout or config.checkout)"
      [ -f "$CHECKOUT/$PACKAGE/stryker.conf.json" ] || fail "no stryker.conf.json at $CHECKOUT/$PACKAGE"
      # Values are single-quoted into the env file — reject quotes
      # and newlines up front rather than escaping.
      for v in "$ID" "$PACKAGE" "$CHECKOUT" "$BASE"; do
        case "$v" in *"'"*|*$'\n'*) fail "value contains a quote or newline" ;; esac
      done
      mkdir -p "${config.worktree_base}/requests"
      {
        printf "KM_ID='%s'\n" "$ID"
        printf "KM_PACKAGE='%s'\n" "$PACKAGE"
        printf "KM_CHECKOUT='%s'\n" "$CHECKOUT"
        printf "KM_BASE_BRANCH='%s'\n" "$BASE"
        printf "KM_BRANCH='%s'\n" "$BRANCH"
      } > "${config.worktree_base}/requests/${ID}.env"
      echo "request $ID accepted: package=$PACKAGE checkout=$CHECKOUT base=$BASE"
    emit:
      '0': "kill-mutants.requested.${event.payload.id}"
      '2': kill-mutants.request.invalid
      default: kill-mutants.request.failed
    timeout: 60

# --- worktree: lasius fetch + worktree add on test/<id> -----------------
# Same mechanics as new-feat.worktree/refactor.worktree: fetch, remove
# any stale worktree at the deterministic path, create the branch at
# origin/<base_branch>. Re-running an id reuses the path — uncommitted
# work there is lost (README safety notes). The stryker.conf.json
# check repeats against the fresh worktree (the route checked the
# possibly-stale checkout).
- id: kill-mutants.worktree
  driver: shell
  on:
  - kill-mutants.requested.*
  emits:
  - kill-mutants.worktree.ready.*
  - kill-mutants.worktree.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      mkdir -p "${config.worktree_base}"
      lasius --root "${config.lasius_root}" vcs fetch "$KM_CHECKOUT" --json >/dev/null
      lasius --root "${config.lasius_root}" vcs worktree remove "$KM_CHECKOUT" --dir "$WT" --json >/dev/null 2>&1 || true
      lasius --root "${config.lasius_root}" vcs worktree add "$KM_CHECKOUT" --dir "$WT" --branch "$KM_BRANCH" --rev "origin/${KM_BASE_BRANCH}" --json >/dev/null
      [ -f "$WT/$KM_PACKAGE/stryker.conf.json" ] || { echo "worktree lacks $KM_PACKAGE/stryker.conf.json"; exit 1; }
      echo "worktree ready: $WT (branch $KM_BRANCH, base origin/$KM_BASE_BRANCH)"
    emit:
      '0': "kill-mutants.worktree.ready.${event.match.1}"
      default: "kill-mutants.worktree.failed.${event.match.1}"
    timeout: 120

# --- install: dependency install at the worktree root ------------------
# Fresh worktrees have no node_modules — the package manager install
# must run before stryker. Config-driven (bun --frozen-lockfile for
# ktbhealth/product; override for npm/pnpm/cargo repos).
- id: kill-mutants.install
  driver: shell
  on:
  - kill-mutants.worktree.ready.*
  emits:
  - kill-mutants.install.done.*
  - kill-mutants.install.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      cd "$WT"
      ${config.install_cmd}
    emit:
      '0': "kill-mutants.install.done.${event.match.1}"
      default: "kill-mutants.install.failed.${event.match.1}"
    timeout: 900

# --- mutate: run the package's mutation suite ---------------------------
# cwd = <worktree>/<package>; output teed to
# <worktree_base>/reports/<id>-mutate.log for postmortems. Success
# requires BOTH rc 0 (a completed stryker run — thresholds.break must
# stay unset in the repo's stryker.conf.json) AND a parseable JSON
# report at <package>/<mutate_report>. Stryker exits non-zero only on
# harness errors, so a non-zero rc is a real failure, not "survivors
# found".
- id: kill-mutants.mutate
  driver: shell
  on:
  - kill-mutants.install.done.*
  emits:
  - kill-mutants.mutate.done.*
  - kill-mutants.mutate.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      mkdir -p "${config.worktree_base}/reports"
      LOG="${config.worktree_base}/reports/${ID}-mutate.log"
      cd "$WT/$KM_PACKAGE"
      RC=0
      ${config.mutate_cmd} 2>&1 | tee "$LOG" || RC=$?
      tail -n 40 "$LOG"
      REPORT="$WT/$KM_PACKAGE/${config.mutate_report}"
      if [ "$RC" -ne 0 ]; then
        echo "mutate exited $RC (log: $LOG)"
        exit 1
      fi
      if [ ! -f "$REPORT" ]; then
        echo "mutate exited 0 but no report at $REPORT (log: $LOG)"
        exit 1
      fi
      jq -e . "$REPORT" >/dev/null || { echo "report at $REPORT is not valid JSON"; exit 1; }
      echo "mutation report: $REPORT"
    emit:
      '0': "kill-mutants.mutate.done.${event.match.1}"
      default: "kill-mutants.mutate.failed.${event.match.1}"
    timeout: 3900

# --- summarize: mutation.json → counts + agent-facing detail -----------
# Copies the report to <worktree_base>/reports/<id>-mutation.json
# (survives worktree cleanup) and writes <id>-mutants.txt: per-status
# counts plus one line per actionable mutant
# (file:line [mutator] status — reason → replacement), capped at
# config.summary_max_lines. Zero actionable mutants → exit 3 →
# summarize.clean.<id> (terminal success, no agent session needed).
- id: kill-mutants.summarize
  driver: shell
  on:
  - kill-mutants.mutate.done.*
  emits:
  - kill-mutants.summarize.done.*
  - kill-mutants.summarize.clean.*
  - kill-mutants.summarize.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      REPORT="$WT/$KM_PACKAGE/${config.mutate_report}"
      OUTDIR="${config.worktree_base}/reports"
      mkdir -p "$OUTDIR"
      COPY="$OUTDIR/${ID}-mutation.json"
      DETAIL="$OUTDIR/${ID}-mutants.txt"
      cp "$REPORT" "$COPY"
      ACTIONABLE='${config.actionable_statuses}'
      TOTAL=$(jq '[.files[].mutants[]] | length' "$REPORT")
      COUNT=$(jq --argjson a "$ACTIONABLE" '[.files[].mutants[] | select(.status as $s | $a | index($s))] | length' "$REPORT")
      {
        echo "package: $KM_PACKAGE"
        echo "branch: $KM_BRANCH (base origin/$KM_BASE_BRANCH)"
        echo "worktree: $WT"
        echo "report copy: $COPY"
        echo "total mutants: $TOTAL"
        echo "actionable (Survived/Timeout/NoCoverage): $COUNT"
        echo
        echo "status counts:"
        jq -r '[.files[].mutants[].status] | group_by(.) | .[] | "\(.[0])\t\(length)"' "$REPORT" | sort
        echo
        echo "actionable mutants (file:line [mutator] status — reason → replacement):"
        ( jq -r --argjson a "$ACTIONABLE" '
            .files | to_entries[] | .key as $f | .value.mutants[] |
            select(.status as $s | $a | index($s)) |
            "\($f):\(.location.start.line) [\(.mutatorName)] \(.status)" +
            (if (.statusReason // "") != "" then " — \(.statusReason[0:200])" else "" end) +
            (if .replacement != null then " → \(.replacement | tostring | .[0:120])" else "" end)
          ' "$REPORT" | head -n "${config.summary_max_lines}" ) || true
      } > "$DETAIL"
      echo "wrote $DETAIL — $COUNT actionable of $TOTAL mutants"
      if [ "$COUNT" -eq 0 ]; then
        echo "no actionable mutants — nothing for the agent to do"
        exit 3
      fi
    emit:
      '0': "kill-mutants.summarize.done.${event.match.1}"
      '3': "kill-mutants.summarize.clean.${event.match.1}"
      default: "kill-mutants.summarize.failed.${event.match.1}"
    timeout: 120

# --- agent: sepia session — kill survivors, prove equivalence ----------
# Same POST /api/sessions/run mechanics as pr-heal.agent: shell+curl so
# the bearer rides curl --config stdin (never `ps` argv), `mode` is
# REQUIRED for unattended turns, per-id agent lock stops parallel
# sessions on one worktree (released by trap on every exit path).
# The prompt carries the package, the survivor detail file, the
# strict equivalence rule, and the repo-convention guardrails.
- id: kill-mutants.agent
  driver: shell
  on:
  - kill-mutants.summarize.done.*
  emits:
  - kill-mutants.agent.done.*
  - kill-mutants.agent.failed.*
  # Operator-driven flow — max_fires is a campaign-lifetime circuit
  # breaker only; per-run bounding is the unique-id contract.
  max_fires: 50
  retry:
    max_attempts: 3
    delay: 5000
    backoff: fixed
  params:
    env:
      KILLMUTANTS_TOKEN: "${secret.PEREGRIN_TOKEN}"
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      DETAIL="${config.worktree_base}/reports/${ID}-mutants.txt"
      LOCK="${config.worktree_base}/wt-${ID}.agent-lock"
      if ! mkdir "$LOCK" 2>/dev/null; then
        echo "agent already in flight for $ID"
        exit 1
      fi
      trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT
      SUMMARY=$(cat "$DETAIL")
      TIMEOUT_S=$(( ${config.agent_timeout_ms} / 1000 + 100 ))
      BODY=$(jq -n \
        --arg cwd "$WT" \
        --arg pkg "$KM_PACKAGE" \
        --arg branch "$KM_BRANCH" \
        --arg base "$KM_BASE_BRANCH" \
        --arg summary "$SUMMARY" \
        --arg agent "${config.agent}" \
        --arg mode "${config.agent_mode}" \
        --argjson timeout "${config.agent_timeout_ms}" \
        '{cwd:$cwd, agent:$agent, mode:$mode, timeoutMs:$timeout, text:(
          "Mutation testing (StrykerJS) found surviving mutants in package \u0027" + $pkg + "\u0027.\n" +
          "Worktree: " + $cwd + " (branch " + $branch + ", based on origin/" + $base + ").\n\n" +
          "Your job: kill the surviving mutants. For EACH actionable mutant in the summary below:\n" +
          "1. Read the mutant location and the surrounding code.\n" +
          "2. Add or strengthen tests so the suite fails on the mutated code — that is what kills a mutant.\n" +
          "3. Re-run the package\u0027s test suite to verify; you may also re-run the mutation suite to confirm kills.\n\n" +
          "Equivalence rule — STRICT: you may silence a mutant with a `// Stryker disable next-line <mutator>: <reason>` comment ONLY after empirically proving the mutant is equivalent or unreachable (e.g. a probe test run against the mutated code, or a demonstrated unreachable path). Never assume equivalence — if you cannot prove it, write the killing test instead. Prefer killing mutants over disabling them.\n\n" +
          "If a mutant exposes a real bug rather than a coverage gap, fix the bug and call it out in your final message.\n\n" +
          "Constraints:\n" +
          "- Work inside package \u0027" + $pkg + "\u0027 (plus repo-root changes its tests require, e.g. shared test helpers or lockfile entries).\n" +
          "- English everywhere; follow the repo\u0027s existing test conventions and style.\n" +
          "- Do NOT commit, push, or open a PR, and do NOT run git/lasius/forge commands — the campaign owns all git and forge operations. Leave changes in the working tree.\n" +
          "- Do NOT modify production source except to add Stryker disable comments for proven-equivalent mutants (or a real bug fix); the deliverable is tests, not refactors.\n\n" +
          "Surviving-mutant report:\n\n" + $summary
        )}')
      # Bearer via curl --config on stdin: keeps the token out of `ps`
      # argv (same pattern as pr-heal.agent).
      RESP=$(printf 'header = "authorization: Bearer %s"\n' "$KILLMUTANTS_TOKEN" |
        curl -sf --max-time "$TIMEOUT_S" --config - \
        -X POST "${config.node_url}/api/sessions/run" \
        -H 'content-type: application/json' -d "$BODY")
      echo "$RESP" | jq .
      printf '%s' "$RESP" | jq -e '(.stopReason == "end_turn" or .stopReason == "cancelled") and (.timedOut != true)' >/dev/null
    emit:
      '0': "kill-mutants.agent.done.${event.match.1}"
      default: "kill-mutants.agent.failed.${event.match.1}"
    timeout: 3960

# --- push: lasius commit + push HEAD to the PR head branch --------------
# No --allow-empty: an agent that produced no diff (e.g. judged every
# survivor equivalent but added no disables/tests) fails the commit
# honestly instead of opening an empty PR.
- id: kill-mutants.push
  driver: shell
  on:
  - kill-mutants.agent.done.*
  emits:
  - kill-mutants.pushed.*
  - kill-mutants.push.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      lasius --root "${config.lasius_root}" vcs commit "$WT" \
        -m "test($KM_PACKAGE): kill surviving mutants" \
        --body "Mutation-testing survivors triaged by a sepia agent session — new/strengthened tests, plus Stryker disable comments only for empirically-proven equivalent mutants. Generated with the kill-mutants workflow bundle" \
        --json
      lasius --root "${config.lasius_root}" vcs push "$WT" \
        --branch "HEAD:refs/heads/$KM_BRANCH" --json
    emit:
      '0': "kill-mutants.pushed.${event.match.1}"
      default: "kill-mutants.push.failed.${event.match.1}"
    timeout: 120

# --- pr: lasius forge pr create ------------------------------------------
# The pushed branch is not the deliverable here — the PR is (unlike
# refactor). pr create re-derives nothing: branch/base come from the
# request env file; the body summarizes what the agent was asked to
# do and points at the kept mutant detail file.
- id: kill-mutants.pr
  driver: shell
  on:
  - kill-mutants.pushed.*
  emits:
  - kill-mutants.pr.created.*
  - kill-mutants.pr.failed.*
  max_fires: unlimited
  params:
    cmd: |
      set -euo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      DETAIL="${config.worktree_base}/reports/${ID}-mutants.txt"
      PR_BODY=$(printf '## Summary\n\nMutation-testing (StrykerJS) survivors in `%s` were triaged by an agent session: real gaps were killed with new or strengthened tests; mutants were silenced with `// Stryker disable` comments only where equivalence/unreachability was verified empirically.\n\n- Package: `%s`\n- Branch: `%s`\n- Base: `%s`\n\nFull surviving-mutant detail is preserved in the campaign artifacts (`%s-mutants.txt`).\n\nGenerated with the kill-mutants workflow bundle' \
        "$KM_PACKAGE" "$KM_PACKAGE" "$KM_BRANCH" "$KM_BASE_BRANCH" "$ID")
      lasius --root "${config.lasius_root}" forge pr create "$WT" \
        --title "test($KM_PACKAGE): kill surviving mutants" \
        --body "$PR_BODY" \
        --base "$KM_BASE_BRANCH" \
        --head "$KM_BRANCH" \
        --json
    emit:
      '0': "kill-mutants.pr.created.${event.match.1}"
      default: "kill-mutants.pr.failed.${event.match.1}"
    timeout: 120

# --- cleanup: worktree after PR created or clean run ---------------------
# The deliverable is on the remote — the worktree has done its job.
# Request env files, mutant summaries and report copies live OUTSIDE
# the worktree under <worktree_base>/{requests,reports} and are kept
# for audit. Failure paths keep the worktree for debugging (README
# ops).
- id: kill-mutants.cleanup
  driver: shell
  on:
  - kill-mutants.pr.created.*
  - kill-mutants.summarize.clean.*
  emits:
  - kill-mutants.cleaned.*
  max_fires: unlimited
  params:
    cmd: |
      set -uo pipefail
      ID='${event.match.1}'
      . "${config.worktree_base}/requests/${ID}.env"
      WT="${config.worktree_base}/wt-${ID}"
      lasius --root "${config.lasius_root}" vcs worktree remove "$KM_CHECKOUT" --dir "$WT" --json >/dev/null 2>&1 || true
      rmdir "${config.worktree_base}/wt-${ID}.agent-lock" 2>/dev/null || true
      echo "cleaned $WT"
    emit:
      '0': "kill-mutants.cleaned.${event.match.1}"
    timeout: 60

# --- terminal reporting --------------------------------------------------
- id: kill-mutants.report
  driver: shell
  on:
  - kill-mutants.request.invalid
  - kill-mutants.request.failed
  - kill-mutants.worktree.failed.*
  - kill-mutants.install.failed.*
  - kill-mutants.mutate.failed.*
  - kill-mutants.summarize.failed.*
  - kill-mutants.agent.failed.*
  - kill-mutants.push.failed.*
  - kill-mutants.pr.failed.*
  - kill-mutants.pr.created.*
  - kill-mutants.summarize.clean.*
  - kill-mutants.cleaned.*
  - node.exhausted
  emits:
  - kill-mutants.report.done
  params:
    cmd: |
      echo "kill-mutants terminal: ${event.type} id=${event.match.1:-?}"
    emit:
      '0': kill-mutants.report.done
    timeout: 30
