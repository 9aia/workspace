# kill-mutants — StrykerJS mutation testing → sepia agent triage →
# tests/disable-comments → push → PR. Tamias bundle
# (`type: peregrin-bundle`). Operator-triggered via an injected
# `mutate.requested` event (POST /api/events/inject) — no webhook
# ingress, no polling.
#
# Boundaries: lasius owns every git/forge call, sepia owns the agent
# session (POST /api/sessions/run → sessions.prompt_wait), peregrin
# owns only event routing, tamias distributes.
name: kill-mutants
version: "0.1.0"
type: peregrin-bundle
description: >-
  Mutation-testing survivor triage — operator-injected
  mutate.requested event → lasius worktree → install + stryker run →
  survivor summary → sepia agent kills mutants with tests (Stryker
  disable comments only for empirically-proven equivalents) → lasius
  commit/push → lasius forge PR. Per-run id keys the worktree,
  request file, branch and artifacts.

provider:
  # SHARED provider identity — same as pr-heal/refactor/new-feat/
  # ci-gate/ci-ingress/docs-deploy: every peregrin-bundle renders
  # services into the ONE peregrin-campaign.service hosting
  # ~/.config/peregrin/serve/*.yaml on the shared webhook listener.
  # Keep `exec` identical.
  name: peregrin
  services:
    - name: campaign
      exec: >-
        ~/.local/bin/peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Advisory only — kill-mutants is operator-triggered through
    # /api/events/inject on the shared listener; nothing registers a
    # forge hook for this bundle.
    - public_url: https://tamias.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  verbs: [run, logs]
