    tagline: "The entrypoint: fetch, store, cache, dispense"
    description: "Package and content manager: every 9aia tool installs and updates through tamias packs."
    layer: delivery
    role: entrypoint
    stage: beta
    status: recent
    order: 1
    website: https://9aia.com/tamias/
    repo: https://github.com/9aia/tamias
    docs: https://9aia.com/tamias/
    depends_on: [pavo]
    integrates_with: [cuora, tarsi, sturn]
