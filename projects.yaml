# 9aia project catalog : canonical metadata for 9aia.com and repo docs.
# Schema: name, tagline (<=10 words), description (one sentence),
# layer (delivery|memory|process|interface), role,
# stage (alpha|beta), status (recent|active|wip|deprecated), order,
# website (docs site), repo, docs.
projects:
